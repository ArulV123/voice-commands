<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zippy — The Bionic Arm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf9f6;
  --panel:#f0ece2;
  --ink:#15181b;
  --ink-dim:#5b5f63;
  --rust:#c14a2e;
  --rust-dim:#a53f27;
  --line:#d8d2c2;
  --line-strong:#b8b09a;
  --green:#1f8b4c;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
}
::selection{background:var(--rust);color:var(--paper);}
img{max-width:100%;display:block;}

/* ---------- top sweep notification banner ---------- */
.top-banner{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
  padding-top:14px;
}
.top-banner-pill{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:10px;
  background:var(--ink);color:var(--paper);
  padding:10px 20px 10px 16px;
  border:1px solid rgba(255,255,255,0.12);
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.04em;
  box-shadow:0 10px 26px -12px rgba(21,24,27,0.5);
  transform:translateY(-140%);
  opacity:0;
  transition:transform 0.55s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease;
}
.top-banner.show .top-banner-pill{transform:translateY(0);opacity:1;}
.top-banner-pill::before{
  content:'';position:absolute;top:0;left:0;height:100%;width:3px;background:var(--rust);
}
.top-banner-pill.ok::before{background:var(--green);}
.top-banner-dot{
  width:7px;height:7px;border-radius:50%;background:var(--rust);flex-shrink:0;
  animation:tbBlink 1.3s ease-in-out infinite;
}
.top-banner-pill.ok .top-banner-dot{background:var(--green);}
@keyframes tbBlink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.top-banner-text{white-space:nowrap;}
.top-banner-text b{font-weight:600;color:#fff;}
.top-banner-sweep{
  position:absolute;top:0;left:-30%;width:30%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);
  animation:tbSweep 2.4s ease-in-out infinite;
}
@keyframes tbSweep{0%{left:-30%;}100%{left:130%;}}

/* ---------- nav ---------- */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 56px;
  background:rgba(250,249,246,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.logo{
  display:flex;align-items:center;gap:10px;
  font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px;letter-spacing:0.02em;
}
.logo-mark{
  width:9px;height:9px;background:var(--rust);
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
}
.nav-links{display:flex;gap:40px;list-style:none;}
.nav-links a{
  color:var(--ink-dim);text-decoration:none;font-family:'IBM Plex Mono',monospace;
  font-size:12px;letter-spacing:0.08em;text-transform:uppercase;font-weight:500;
  transition:color 0.25s;
}
.nav-links a:hover{color:var(--rust);}
.nav-cta{
  border:1px solid var(--ink);padding:13px 26px;
  font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--ink);text-decoration:none;transition:all 0.3s;
  background:none;cursor:pointer;
  display:flex;align-items:center;gap:8px;
}
.nav-cta:hover{background:var(--ink);color:var(--paper);}
.nav-cta .dot{width:6px;height:6px;border-radius:50%;background:var(--line-strong);transition:background 0.3s;}
.nav-cta.connected .dot{background:var(--green);}

/* ---------- hero ---------- */
.hero{
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:140px 56px 60px;position:relative;
}
.hero-top{max-width:1360px;margin:0 auto;width:100%;}
.hero-grid{
  display:grid;grid-template-columns:0.95fr 1.05fr;gap:64px;align-items:center;
}
.doc-tag{
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--rust);
  letter-spacing:0.12em;text-transform:uppercase;margin-bottom:22px;
  display:flex;align-items:center;gap:10px;
  opacity:0;animation:fadeUp 0.7s ease 0.1s forwards;
}
.doc-tag::before{content:'FIG.01';border:1px solid var(--rust);padding:2px 7px;font-size:10.5px;}
h1.title{
  font-family:'Space Grotesk',sans-serif;font-weight:300;
  font-size:clamp(2.6rem,5.6vw,4.6rem);line-height:1.04;letter-spacing:-0.015em;
  margin-bottom:26px;color:var(--ink);
}
h1.title strong{font-weight:600;display:block;}
h1.title .fade{opacity:0;animation:fadeUp 0.7s ease 0.25s forwards;}
h1.title .fade2{opacity:0;animation:fadeUp 0.7s ease 0.4s forwards;}
.hero-copy{
  font-size:16px;line-height:1.75;color:var(--ink-dim);max-width:480px;margin-bottom:34px;
  opacity:0;animation:fadeUp 0.7s ease 0.55s forwards;
}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;opacity:0;animation:fadeUp 0.7s ease 0.7s forwards;}
.btn-primary{
  background:var(--ink);color:var(--paper);padding:19px 38px;border:1px solid var(--ink);
  font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;
  text-decoration:none;display:inline-flex;align-items:center;gap:10px;transition:all 0.3s;
  cursor:pointer;
}
.btn-primary:hover{background:var(--rust);border-color:var(--rust);}
.btn-secondary{
  color:var(--ink);text-decoration:none;padding:19px 36px;border:1px solid var(--line-strong);
  font-family:'IBM Plex Mono',monospace;font-size:14.5px;letter-spacing:0.06em;text-transform:uppercase;
  transition:all 0.3s;display:inline-flex;align-items:center;gap:10px;
  background:none;cursor:pointer;
}
.btn-secondary:hover{border-color:var(--ink);}
.btn-primary svg,.btn-secondary svg{width:16px;height:16px;flex-shrink:0;}
@media (max-width:640px){
  .btn-primary,.btn-secondary{padding:17px 26px;font-size:13.5px;width:100%;justify-content:center;}
  .hero-actions{flex-direction:column;}
}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

/* ---------- blueprint frame for arm image ---------- */
.blueprint{
  position:relative;padding:36px 30px 54px;
  opacity:0;animation:fadeIn 1s ease 0.35s forwards;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.corner{
  position:absolute;width:20px;height:20px;
  border-color:var(--ink);border-style:solid;border-width:0;
}
.corner.tl{top:0;left:0;border-top-width:1.5px;border-left-width:1.5px;}
.corner.tr{top:0;right:0;border-top-width:1.5px;border-right-width:1.5px;}
.corner.bl{bottom:20px;left:0;border-bottom-width:1.5px;border-left-width:1.5px;}
.corner.br{bottom:20px;right:0;border-bottom-width:1.5px;border-right-width:1.5px;}
.bp-img-wrap{
  position:relative;background:#fff;border:1px solid var(--line);
  padding:28px;
}
.bp-img-wrap img{
  width:100%;
  filter:sepia(0.06) contrast(1.05);
}
.dim-line{
  position:absolute;bottom:2px;left:28px;right:28px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);
}
.dim-line .tick{width:1px;height:8px;background:var(--line-strong);}
.dim-line .track{flex:1;height:1px;background:var(--line-strong);margin:0 8px;position:relative;}

.hero-meta{
  display:flex;gap:0;margin-top:26px;border-top:1px solid var(--line);
  opacity:0;animation:fadeUp 0.7s ease 0.9s forwards;
}
.hm-item{flex:1;padding:16px 0 0;border-right:1px solid var(--line);padding-right:16px;margin-right:16px;}
.hm-item:last-child{border-right:none;}
.hm-num{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.5rem;}
.hm-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);letter-spacing:0.06em;text-transform:uppercase;margin-top:4px;}

/* ---------- section shared ---------- */
section{padding:130px 56px;max-width:1360px;margin:0 auto;}
.section-head{max-width:620px;margin-bottom:70px;}
.tag-label{
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--rust);
  letter-spacing:0.1em;text-transform:uppercase;margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
}
.tag-label::before{content:'';width:20px;height:1px;background:var(--rust);}
h2{
  font-family:'Space Grotesk',sans-serif;font-weight:300;font-size:clamp(2rem,3.4vw,2.9rem);
  line-height:1.15;letter-spacing:-0.01em;color:var(--ink);
}
h2 strong{font-weight:600;}
.section-sub{color:var(--ink-dim);font-size:15.5px;line-height:1.75;margin-top:20px;max-width:540px;}

/* ---------- overview ---------- */
.overview-grid{display:grid;grid-template-columns:0.85fr 1.15fr;gap:70px;align-items:start;}
.overview-copy p{color:var(--ink-dim);font-size:16px;line-height:1.85;margin-bottom:22px;}
.overview-copy strong{color:var(--ink);font-weight:600;}
.stat-block{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:8px;}
.stat{background:var(--paper);padding:28px 24px;}
.stat-num{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:2.3rem;color:var(--ink);}
.stat-num span{color:var(--rust);}
.stat-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-dim);letter-spacing:0.06em;text-transform:uppercase;margin-top:8px;}

/* ---------- architecture list ---------- */
.arch-list{border-top:1px solid var(--line);}
.arch-item{
  display:grid;grid-template-columns:70px 1fr 1.3fr;gap:30px;
  padding:34px 0;border-bottom:1px solid var(--line);
}
.arch-index{font-family:'IBM Plex Mono',monospace;color:var(--line-strong);font-size:12.5px;padding-top:4px;}
.arch-name{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:1.25rem;color:var(--ink);}
.arch-name small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:10.5px;color:var(--rust);letter-spacing:0.06em;margin-top:6px;text-transform:uppercase;}
.arch-desc{color:var(--ink-dim);font-size:14.5px;line-height:1.75;}

/* ---------- signal flow ---------- */
.flow-wrap{border:1px solid var(--line);padding:52px 44px;background:var(--panel);}
.flow-row{display:flex;align-items:stretch;justify-content:space-between;gap:0;flex-wrap:wrap;}
.flow-node{flex:1;min-width:150px;text-align:center;padding:10px 12px;}
.fn-index{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--rust);letter-spacing:0.06em;margin-bottom:10px;}
.fn-icon{
  width:56px;height:56px;border:1.5px solid var(--ink);margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;color:var(--ink);
  font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--paper);
}
.fn-label{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:500;color:var(--ink);margin-bottom:6px;}
.fn-sub{font-size:11px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;}
.flow-arrow{color:var(--line-strong);font-size:18px;padding:0 6px;flex-shrink:0;display:flex;align-items:center;}

/* ---------- specs ---------- */
.specs-table{width:100%;border-collapse:collapse;margin-top:16px;}
.specs-table tr{border-bottom:1px solid var(--line);}
.specs-table tr:first-child{border-top:1px solid var(--line);}
.specs-table td{padding:20px 8px;font-size:14.5px;}
.specs-table td:first-child{color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.04em;text-transform:uppercase;width:230px;}
.specs-table td:last-child{color:var(--ink);}

/* ---------- app / roadmap ---------- */
.split-band{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;}
.feature-list{list-style:none;margin-top:26px;}
.feature-list li{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);color:var(--ink-dim);font-size:14.5px;line-height:1.6;}
.feature-list li::before{content:'';width:5px;height:5px;background:var(--rust);margin-top:8px;flex-shrink:0;}
.feature-list li strong{color:var(--ink);font-weight:500;}

.roadmap-card{border:1px solid var(--line);padding:34px;position:relative;background:var(--panel);}
.roadmap-card::before{content:'';position:absolute;top:0;left:0;width:2px;height:100%;background:var(--rust);}
.rm-tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--rust);letter-spacing:0.08em;text-transform:uppercase;}
.roadmap-card h3{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:1.35rem;margin:12px 0 12px;color:var(--ink);}
.roadmap-card p{color:var(--ink-dim);font-size:14.5px;line-height:1.7;}

/* ---------- connect section ---------- */
.connect-band{
  border:1px solid var(--line);background:var(--panel);
  padding:64px 56px;display:grid;grid-template-columns:1.1fr 0.9fr;gap:60px;align-items:center;
  position:relative;overflow:hidden;
}
.connect-band::before{content:'';position:absolute;top:0;left:0;width:2px;height:100%;background:var(--rust);}
.connect-copy .tag-label{margin-bottom:16px;}
.connect-copy h2{margin-bottom:10px;}
.connect-copy p{color:var(--ink-dim);font-size:15px;line-height:1.75;margin-top:18px;max-width:460px;}
.connect-status-line{
  display:flex;align-items:center;gap:10px;margin-top:28px;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-dim);
}
.connect-status-line .dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);transition:background 0.3s;}
.connect-status-line.is-connected .dot{background:var(--green);}
.connect-status-line.is-connected{color:var(--green);}
.connect-visual{
  border:1px solid var(--line);background:#fff;padding:30px;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-dim);
  display:flex;flex-direction:column;gap:14px;
}
.connect-visual .cv-row{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:12px;}
.connect-visual .cv-row:last-child{border-bottom:none;padding-bottom:0;}
.connect-visual .cv-label{color:var(--ink-dim);}
.connect-visual .cv-val{color:var(--ink);font-weight:500;}

/* ---------- user dashboard (post sign-in screen) ---------- */
.dash-wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 24px;}
.dash-profile-bar{
  display:flex;align-items:center;gap:22px;padding:26px 30px;
  border:1px solid var(--line);background:#fff;margin-bottom:28px;
  position:relative;overflow:hidden;
}
.dash-profile-bar::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--rust);}
.dash-avatar{
  width:64px;height:64px;border-radius:50%;border:1.5px solid var(--ink);flex-shrink:0;
  overflow:hidden;background:var(--panel);display:flex;align-items:center;justify-content:center;
}
.dash-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.dash-profile-info{flex:1;min-width:0;}
.dash-profile-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.4rem;color:var(--ink);overflow-wrap:anywhere;word-break:break-word;}
.dash-profile-email{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);margin-top:4px;letter-spacing:0.02em;overflow-wrap:anywhere;word-break:break-word;}
.dash-profile-badges{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.dash-badge{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;
  padding:4px 10px;border:1px solid var(--line-strong);color:var(--ink-dim);display:flex;align-items:center;gap:6px;
}
.dash-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--line-strong);}
.dash-badge.online{border-color:var(--green);color:var(--green);}
.dash-badge.online .dot{background:var(--green);}
.dash-signout-btn{
  background:none;color:var(--ink);border:1px solid var(--line-strong);flex-shrink:0;
  padding:14px 26px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:0.06em;text-transform:uppercase;
  cursor:pointer;transition:all 0.25s;
}
.dash-signout-btn:hover{border-color:var(--rust);color:var(--rust);}

.dash-section-label{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--rust);letter-spacing:0.1em;text-transform:uppercase;
  margin:0 0 14px;display:flex;align-items:center;gap:10px;
}
.dash-section-label::before{content:'';width:18px;height:1px;background:var(--rust);}

.dash-stat-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:28px;
}
.dash-stat{background:#fff;padding:20px 22px;}
.dash-stat-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;}
.dash-stat-val{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.15rem;color:var(--ink);display:flex;align-items:center;gap:8px;}
.dash-stat-val .dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex-shrink:0;}
.dash-stat-val .dot.online{background:var(--green);}

.dash-detail-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:40px;
}
.dash-detail-row{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:16px 22px;gap:14px;flex-wrap:wrap;}
.dash-detail-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-dim);letter-spacing:0.05em;text-transform:uppercase;flex-shrink:0;}
.dash-detail-val{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);font-weight:500;overflow-wrap:anywhere;word-break:break-word;text-align:right;min-width:0;}

.dash-apps-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
.dash-app-card{
  position:relative;background:#fff;border:1px solid var(--line);
  display:flex;flex-direction:column-reverse;align-items:center;justify-content:center;gap:18px;
  padding:44px 24px;text-align:center;
  transition:border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  cursor:pointer;text-decoration:none;color:inherit;
}
.dash-app-card:hover{
  border-color:var(--ink);
  transform:translateY(-3px);
  box-shadow:0 14px 28px -18px rgba(21,24,27,0.32);
}
.dash-app-icon{
  flex-shrink:0;width:132px;height:132px;
  border:1px solid var(--line-strong);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:border-color 0.2s ease, background 0.2s ease;
  background:var(--panel);
}
.dash-app-card:hover .dash-app-icon{border-color:var(--ink);background:#fff;}
.dash-app-icon img{width:68px;height:68px;object-fit:contain;display:block;}
.dash-app-icon svg{width:54px;height:54px;}
.dash-app-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17.5px;color:var(--ink);}
.dash-app-card.coming-soon{cursor:default;}
.dash-app-card.coming-soon:hover{transform:none;box-shadow:none;border-color:var(--line);}
.dash-app-card.coming-soon .dash-app-icon{opacity:0.4;}
.dash-app-card.coming-soon .dash-app-title{opacity:0.45;}


.qt-no-scroll{overflow:hidden;}
.qt-arm-topbar h3{
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;
  font-size:1.5rem;
  color:var(--ink);
  margin:0;
}
.gesture-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-dim);
}
@media (max-width:900px){
  }
@media (max-width:640px){
        .gesture-label{
    font-size:11px;
  }
}

/* ---------- premium dashboard loader: robotics signal readout ---------- */

.dash-loader{
  position:absolute;inset:0;z-index:5;
  background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  transition:opacity 0.6s ease, visibility 0.6s ease;
}
.dash-loader.hide{opacity:0;visibility:hidden;pointer-events:none;}
.dl-center{display:flex;flex-direction:column;align-items:center;gap:24px;}
.dl-rig{
  position:relative;width:150px;height:88px;
  border:1px solid var(--line);background:#fff;

}

}

}

.scan-text{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);letter-spacing:0.04em;text-transform:uppercase;}

/* device picked / connecting */

}

}

  cursor:pointer;transition:all 0.25s;flex-shrink:0;
}
.connect-btn:hover{background:var(--rust-dim);}
.connect-btn:disabled{opacity:0.55;cursor:default;}

/* connecting state */
.connecting-wrap{text-align:center;padding:10px 0 6px;}
.connecting-ring{
  width:64px;height:64px;border:2px solid var(--line);border-top-color:var(--ink);

}
.connecting-label{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);letter-spacing:0.05em;text-transform:uppercase;}

/* code entry */
.code-input{
  width:100%;background:var(--paper);border:1.5px solid var(--line-strong);color:var(--ink);
  padding:16px 14px;font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;
  letter-spacing:0.5em;text-align:center;outline:none;transition:border-color 0.2s;
}
.code-input:focus{border-color:var(--rust);}
.code-input.shake{animation:shakeInput 0.4s ease;border-color:var(--rust);}
@keyframes shakeInput{
  10%,90%{transform:translateX(-2px);}
  20%,80%{transform:translateX(4px);}
  30%,50%,70%{transform:translateX(-8px);}
  40%,60%{transform:translateX(8px);}
}

/* success — Paytm-style pop-in filled tick */
.success-wrap{text-align:center;padding:14px 0 6px;}
.check-circle{
  width:clamp(76px,16vw,140px);height:clamp(76px,16vw,140px);
  border-radius:50%;background:var(--green);margin:0 auto 24px;
  display:flex;align-items:center;justify-content:center;position:relative;
  transform:scale(0);animation:popIn 0.45s cubic-bezier(.34,1.56,.64,1) forwards;
}
.check-circle svg{width:52%;height:52%;}
.check-circle .cc-path{
  stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:48;stroke-dashoffset:48;animation:drawCheck 0.35s ease 0.35s forwards;
}
.check-circle .cc-ring{ stroke:none; fill:none; }
@keyframes popIn{
  0%{transform:scale(0);}
  60%{transform:scale(1.15);}
  100%{transform:scale(1);}
}
@keyframes drawCheck{to{stroke-dashoffset:0;}}
.success-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(19px,2.4vw,26px);color:var(--ink);margin-bottom:8px;
  opacity:0;animation:fadeUp 0.5s ease 0.5s forwards;}
.success-sub{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-dim);letter-spacing:0.03em;

  cursor:pointer;transition:all 0.25s;
  opacity:0;animation:fadeUp 0.5s ease 0.7s forwards;
}
.success-done-btn:hover{border-color:var(--ink);}

/* error state */
.error-wrap{text-align:center;padding:10px 0 6px;}
.error-icon{
  width:56px;height:56px;border-radius:50%;border:2px solid var(--rust);margin:0 auto 20px;

<script>
/* ===== Standalone Voice Page bridge ===== */
const MAIN_PAGE_URL = 'actualworkingpage(3)_separated_gesture(1).html';
const MAIN_PAGE_WINDOW = 'ZippyMainPage';
const CODE_VERIFIED_KEY = 'zippyVerifiedEmail';

/* Browser microphone security:
   Do not request getUserMedia from a local file:// page. Chrome treats
   file:// visits differently and may show the microphone prompt repeatedly.
   Use VS Code Live Server / localhost (or HTTPS) for this page. */
const VOICE_MIC_ALLOWED_CONTEXT = window.isSecureContext || location.hostname === 'localhost' || location.hostname === '127.0.0.1';

const firebaseConfig = {
  apiKey: "AIzaSyBTCit215onnSyWXjDXRXU1tVsVmKW4MHU",
  authDomain: "zippythebionicarm.firebaseapp.com",
  databaseURL: "https://zippythebionicarm-default-rtdb.firebaseio.com",
  projectId: "zippythebionicarm",
  storageBucket: "zippythebionicarm.firebasestorage.app",
  messagingSenderId: "1000242987274",
  appId: "1:1000242987274:web:6ab9da304f2dfd6b9d3af3"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

async function sendDeviceCommand(code,name,value){
  if(!code){return false;}
  try{
    await db.ref('users/' + code + '/command').set({
      name:name,
      value:value,
      ts:firebase.database.ServerValue.TIMESTAMP
    });
    return true;
  }catch(err){
    console.error('sendDeviceCommand failed:',err);
    return false;
  }
}

let currentUserCode=null;
let deviceStatusRef=null;
let deviceStatusTimer=null;

const zvConnectionStatus=document.getElementById('zvConnectionStatus');
const zvConnectionText=document.getElementById('zvConnectionText');

function setConnectionIndicator(state){
  if(!zvConnectionStatus||!zvConnectionText)return;
  zvConnectionStatus.classList.remove('online','offline');
  if(state==='online'){zvConnectionStatus.classList.add('online');zvConnectionText.textContent='ESP32 Online';}
  else if(state==='offline'){zvConnectionStatus.classList.add('offline');zvConnectionText.textContent='ESP32 Offline';}
  else if(state==='error'){zvConnectionStatus.classList.add('offline');zvConnectionText.textContent='Connection Error';}
  else{zvConnectionText.textContent='Checking connection';}
}

function goToMainPage(){
  try{
    if(window.opener && !window.opener.closed){
      window.opener.focus();
      return;
    }
  }catch(e){}
  try{
    const w=window.open(MAIN_PAGE_URL,MAIN_PAGE_WINDOW);
    if(w){w.focus();return;}
  }catch(e){}
  window.location.href=MAIN_PAGE_URL;
}

async function findUserRecordByEmail(email){
  const snap=await db.ref('users').orderByChild('email').equalTo(String(email||'').toLowerCase()).once('value');
  if(!snap.exists())return null;
  let match=null;
  snap.forEach(child=>{match={code:child.key,...child.val()};});
  return match;
}

function setVoiceConnectionState(online){setConnectionIndicator(online?'online':'offline');}

function setSessionMessage(message){
  if(!zvConnectionText)return;
  zvConnectionStatus.classList.remove('online','offline');
  if(message==='● Connect on Main Page'){zvConnectionStatus.classList.add('offline');zvConnectionText.textContent='Not Connected';}
  else if(message==='● Verify on Main Page'){zvConnectionStatus.classList.add('offline');zvConnectionText.textContent='Verify Connection';}
  else if(message==='● Account not found'){zvConnectionStatus.classList.add('offline');zvConnectionText.textContent='Account Not Found';}
  else{zvConnectionStatus.classList.add('offline');zvConnectionText.textContent='Connection Error';}
}

function startDeviceStatus(code){
  if(deviceStatusRef)deviceStatusRef.off('value');
  if(deviceStatusTimer)clearInterval(deviceStatusTimer);
  deviceStatusRef=db.ref('users/'+code);
  const render=snap=>{
    const data=snap.val()||{};
    const online=data.status==='online';
    setVoiceConnectionState(online);
  };
  deviceStatusRef.on('value',render);
  deviceStatusTimer=setInterval(async()=>{
    try{render(await deviceStatusRef.once('value'));}
    catch(e){setConnectionIndicator('error');}
  },1000);
}

function stopDeviceStatus(){
  if(deviceStatusRef){deviceStatusRef.off('value');deviceStatusRef=null;}
  if(deviceStatusTimer){clearInterval(deviceStatusTimer);deviceStatusTimer=null;}
}

function readMainPageState(){
  try{return JSON.parse(localStorage.getItem('zippyCrossPageState_v1')||'null');}catch(e){return null;}
}
async function restoreSession(user){
  if(!user){
    setSessionMessage('● Connect on Main Page');
    currentUserCode=null;
    return;
  }
  const email=(user.email||'').toLowerCase();
  const st=readMainPageState();
  const stEmail=String((st&&st.googleUser&&st.googleUser.email)||(st&&st.verifiedEmail)||'').toLowerCase();
  const stateOk=!!(st&&st.currentUserCode&&stEmail===email);
  const verified=(localStorage.getItem(CODE_VERIFIED_KEY)||'').toLowerCase()===email;
  if(!verified&&!stateOk){
    setSessionMessage('● Verify on Main Page');
    currentUserCode=null;
    return;
  }
  /* Use the code the main page already verified, straight away */
  if(stateOk){
    currentUserCode=String(st.currentUserCode);
    try{localStorage.setItem('zippyCurrentUserCode',currentUserCode);}catch(e){}
    startDeviceStatus(currentUserCode);
  }
  try{
    const record=await findUserRecordByEmail(email);
    if(record){
      currentUserCode=String(record.code);
      try{localStorage.setItem('zippyCurrentUserCode',currentUserCode);}catch(e){}
      startDeviceStatus(currentUserCode);
    }else if(!stateOk){
      currentUserCode=null;
      setSessionMessage('● Account not found');
    }
  }catch(err){
    if(!stateOk){currentUserCode=null;setSessionMessage('● Connection error');}
  }
}

window.addEventListener('DOMContentLoaded',()=>{
  document.body.classList.add('qt-no-scroll');
  const overlay=document.getElementById('qtVoiceOverlay');
  if(overlay){overlay.classList.add('show');overlay.style.removeProperty('display');}
  const closeBtn=document.getElementById('qtVoiceCloseBtn');
  if(closeBtn){
    closeBtn.title='Stop recording';
  }
  auth.onAuthStateChanged(restoreSession);
});

window.addEventListener('beforeunload',()=>stopDeviceStatus());
</script>

  if(!VOICE_MIC_ALLOWED_CONTEXT){
    stateEl.textContent='● Local file mode';
    hint.textContent='Use http://localhost or HTTPS for microphone access';
  }

  const STORAGE_KEY='zippyVoiceHistory_v1';
  let recorder=null,stream=null,chunks=[],blob=null,startedAt=0,audioContext=null,analyser=null,frame=0,
recognition=null,finalText='',interimText='',pendingSend=false,isSending=false,waveHistory=[],waveWidth=0,
voiceDetected=false,recognitionSettled=false,finishTimer=null,
recognitionReady=false,recognitionWanted=false,micStreamPromise=null,pageClosing=false;

  const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const timeNow=()=>new Intl.DateTimeFormat([], {hour:'numeric',minute:'2-digit'}).format(new Date());
  const dateNow=()=>new Date().toISOString();
  const duration=ms=>{const s=Math.max(1,Math.round((ms||0)/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  const readHistory=()=>{try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}};
  const writeHistory=x=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(x.slice(0,20)))}catch(e){}};
  const fmtDate=x=>{try{return new Intl.DateTimeFormat([], {dateStyle:'medium',timeStyle:'short'}).format(new Date(x))}catch(e){return '—'}};
  const dataUrlFromBlob=b=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(b)});

  function setTab(tab){
    const h=tab==='history';
    speakTab.classList.toggle('active',!h);historyTab.classList.toggle('active',h);
    speakTab.setAttribute('aria-selected',String(!h));historyTab.setAttribute('aria-selected',String(h));
    speakPanel.classList.toggle('active',!h);historyPanel.classList.toggle('active',h);
    if(h)renderHistory();
  }

  function openVoice(e){if(e)e.preventDefault();overlay.style.removeProperty('display');overlay.classList.add('show');document.body.classList.add('qt-no-scroll');setTab('speak');resizeCanvas()}
  function releaseMicrophone(){
    pageClosing=true;
    recognitionWanted=false;

    if(recognition){
      try{recognition.stop();}catch(e){}
    }

    if(stream){
      stream.getTracks().forEach(t=>t.stop());
      stream=null;
    }

    micStreamPromise=null;

    if(audioContext){audioContext.close().catch(()=>{});audioContext=null;}
    analyser=null;
  }

  function closeVoice(){
    try{window.ZV&&window.ZV.toast('Staying on this page - just tap the mic to talk')}catch(e){}
    try{if(recorder&&recorder.state==='recording')stopRecording(false)}catch(e){}
    try{resetLocal(false)}catch(e){}
    try{resetWave()}catch(e){}
  }

  function resizeCanvas(){
    const r=waveCanvas.getBoundingClientRect(),d=window.devicePixelRatio||1;
    const w=Math.max(1,Math.floor(r.width)),h=Math.max(1,Math.floor(r.height));
    waveCanvas.width=Math.floor(w*d);waveCanvas.height=Math.floor(h*d);waveWidth=w;
    const points=Math.max(28,Math.floor(w/6));
    if(waveHistory.length>points)waveHistory=waveHistory.slice(waveHistory.length-points);
  }

  function drawWave(){
    if(!analyser)return;
    const rect=inputShell.getBoundingClientRect(),w=Math.max(1,Math.floor(rect.width)),h=Math.max(1,Math.floor(rect.height)),d=window.devicePixelRatio||1;
    if(waveWidth!==w){waveWidth=w;waveCanvas.width=Math.floor(w*d);waveCanvas.height=Math.floor(h*d);waveHistory=[];}
    const c=waveCanvas.getContext('2d');
    c.setTransform(d,0,0,d,0,0);
    c.clearRect(0,0,w,h);

    const data=new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(data);
    let sum=0;
    for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;sum+=v*v;}
    const rms=Math.sqrt(sum/data.length);
    const normalized=Math.min(1,Math.max(0,(rms-0.008)/0.12));
    if(normalized>0.08)voiceDetected=true;
    const smoothed=(waveHistory.length?waveHistory[waveHistory.length-1]:0)*0.68+normalized*0.32;
    waveHistory.push(Math.min(1,smoothed));
    const points=Math.max(28,Math.floor(w/6));
    while(waveHistory.length>points)waveHistory.shift();

    c.fillStyle='rgba(21,24,27,.96)';
    const gap=Math.max(2,w/points*.34);
    const barW=Math.max(3,Math.min(9,w/points-gap));
    const maxH=h*.92;
    const baseX=w-waveHistory.length*(barW+gap);
    for(let i=0;i<waveHistory.length;i++){
      const a=waveHistory[i];
      const shaped=Math.pow(a,0.72);
      const height=Math.max(1,maxH*shaped);
      const x=baseX+i*(barW+gap);
      const y=(h-height)/2;
      c.beginPath();
      c.roundRect(x,y,barW,height,Math.min(barW/2,5));
      c.fill();
    }
    frame=requestAnimationFrame(drawWave);
  }

  function resetWave(){waveHistory=[];cancelAnimationFrame(frame);const c=waveCanvas.getContext('2d');const d=window.devicePixelRatio||1;const r=waveCanvas.getBoundingClientRect();const w=Math.max(1,r.width),h=Math.max(1,r.height);waveCanvas.width=Math.floor(w*d);waveCanvas.height=Math.floor(h*d);c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h)}

  /*
    Keep ONE SpeechRecognition object for the entire Voice Control page.
    It is started once after microphone permission is granted and stays alive
    between microphone button presses. This prevents repeated permission
    prompts from SpeechRecognition.
  */
  function ensureRecognition(){
    if(recognitionReady && recognition)return true;

    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){
      recognitionSettled=true;
      return false;
    }

    recognition=new SR();
    recognition.continuous=true;
    recognition.interimResults=true;
    recognition.lang=navigator.language||'en-US';

    recognition.onresult=e=>{
      if(!(recorder&&recorder.state==='recording'))return;

      let f='',i='';
      for(let n=e.resultIndex;n<e.results.length;n++){
        const r=e.results[n],t=r[0].transcript;
        if(r.isFinal)f+=t;else i+=t;
      }

      if(f)finalText=(finalText+' '+f).replace(/\s+/g,' ').trim();
      interimText=i.trim();
    };

    recognition.onerror=err=>{
      console.warn('SpeechRecognition error:',err&&err.error);
      recognitionSettled=true;

      if(err&&(err.error==='not-allowed'||err.error==='service-not-allowed')){
        stateEl.textContent='● Mic permission required';
        hint.textContent='Allow microphone access once, then try again.';
      }
    };

    recognition.onend=()=>{
      recognitionSettled=true;

      /*
        Keep the same SpeechRecognition object alive while the page is open.
        Chrome may end the recognition service on its own; restarting the same
        object does not create another getUserMedia permission request.
      */
      if(recognitionWanted&&!pageClosing){
        setTimeout(()=>{
          if(!recognitionWanted||pageClosing)return;
          try{
            recognitionSettled=false;
            recognition.start();
          }catch(e){}
        },120);
      }
    };

    recognitionReady=true;
    recognitionWanted=true;
    recognitionSettled=true;
    return true;
  }

  async function startRecognition(){
    if(!ensureRecognition())return false;

    recognitionWanted=true;

    try{
      recognitionSettled=false;
      recognition.start();
    }catch(e){
      /* Already running — this is expected on later microphone clicks. */
    }

    return true;
  }

  function stopRecognition(){
    /*
      Only used during real page shutdown. Never call this between recordings.
    */
    recognitionWanted=false;
    recognitionSettled=true;

    if(recognition){
      try{recognition.stop();}catch(e){}
    }

    return Promise.resolve();
  }

  const cleanTranscript=v=>String(v||'').replace(/[^\p{L}\p{N}\s']/gu,' ').replace(/\s+/g,' ').trim();
  const hasMeaningfulTranscript=v=>{
    const t=cleanTranscript(v);
    if(!t)return false;
    const words=t.split(' ').filter(Boolean);
    return words.some(w=>w.replace(/['\d]/g,'').length>=2) || t.replace(/[^\p{L}\p{N}]/gu,'').length>=3 || /\d/.test(t);
  };
  function chooseMime(){const types=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];return types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||''}

  async function startRecording(){
    if(recorder&&recorder.state==='recording')return;

    if(!VOICE_MIC_ALLOWED_CONTEXT){
      stateEl.textContent='● Open through localhost';
      hint.textContent='Run this page with VS Code Live Server, not by opening the HTML file directly';
      inputShell.classList.add('voice-warning');
      showVoiceWarning();
      setTimeout(()=>inputShell.classList.remove('voice-warning'),2200);
      return;
    }

    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){stateEl.textContent='● Mic unavailable';return}
    try{
      /*
        Request microphone permission ONCE for this page session.
        After the first Allow, the same MediaStream is reused for every
        microphone click. No later click calls getUserMedia().
      */
      if(!stream || !stream.getTracks().some(t=>t.readyState==='live')){
        if(!micStreamPromise){
          micStreamPromise=navigator.mediaDevices.getUserMedia({audio:true})
            .then(s=>{
              stream=s;

              /*
                Do not automatically request permission again if the browser
                ends the stream. Tell the user to reload instead.
              */
              stream.getTracks().forEach(track=>{
                track.addEventListener('ended',()=>{
                  if(!pageClosing){
                    stream=null;
                    micStreamPromise=null;
                    stateEl.textContent='● Microphone ended';
                    hint.textContent='Reload this page to reconnect the microphone';
                  }
                });
              });

              return s;
            })
            .catch(err=>{
              micStreamPromise=null;
              throw err;
            });
        }

        stream=await micStreamPromise;
      }

      /* Keep SpeechRecognition alive for the page session too. */
      await startRecognition();

      const mime=chooseMime();

      chunks=[];blob=null;startedAt=Date.now();pendingSend=false;voiceDetected=false;hint.textContent='Listening…';resetWave();resizeCanvas();
      recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      recorder.onstop=finishRecording;

      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){
        /* Reuse the same microphone stream. Create/resume the analyser as needed. */
        if(!audioContext || audioContext.state==='closed') audioContext=new AC();
        if(audioContext.state==='suspended') await audioContext.resume().catch(()=>{});
        analyser=audioContext.createAnalyser();
        analyser.fftSize=512;
        analyser.smoothingTimeConstant=.58;
        const source=audioContext.createMediaStreamSource(stream);
        source.connect(analyser);
      }

      inputShell.classList.add('recording');
      micBtn.classList.add('recording');
      stateEl.textContent='● Recording';
      hint.textContent='Listening…';

      /*
        SpeechRecognition is already running for this page session.
        Only MediaRecorder starts/stops for each command.
      */
      recorder.start(100);
      frame=requestAnimationFrame(drawWave);
      sendBtn.classList.toggle('show',!autoSend.checked);
    }catch(e){
      console.error('Microphone start failed:',e);
      stateEl.textContent='● Mic permission required';
      analyser=null;
    }
  }

  function stopRecording(keepSendButton){
    if(recorder && recorder.state==='recording')recorder.stop();

    /*
      Keep BOTH the microphone stream and SpeechRecognition alive.
      This is what makes the second, third, fourth... mic click work
      without another permission prompt.
    */
    analyser=null;
    recorder=null;
    inputShell.classList.remove('recording');
    micBtn.classList.remove('recording');
    stateEl.textContent='● Ready';
    cancelAnimationFrame(frame);

    if(!keepSendButton)sendBtn.classList.remove('show');
  }

  async function finishRecording(){
    blob=new Blob(chunks,{type:recorder&&recorder.mimeType?recorder.mimeType:'audio/webm'});
    await new Promise(r=>setTimeout(r,450));
    const text=cleanTranscript(finalText+' '+interimText);
    if(!hasMeaningfulTranscript(text)){
      pendingSend=false;
      sendBtn.classList.remove('show');
      stateEl.textContent='● No voice detected';
      hint.textContent='No speech detected. Please try again.';
      inputShell.classList.add('voice-warning');
      showVoiceWarning();
      setTimeout(()=>inputShell.classList.remove('voice-warning'),1800);
      resetLocal(false);
      resetWave();
      return;
    }
    if(autoSend.checked||pendingSend){pendingSend=false;setTimeout(()=>sendRecording(),80);}
    else{sendBtn.classList.add('show');stateEl.textContent='● Ready';}
  }

  function addMessage(item,animate){
    if(emptyState)emptyState.style.display='none';
    const box=document.createElement('div');box.className='qt-voice-msg user'+(item.failed?' failed':'');
    box.innerHTML='<div class="qt-voice-msg-head"><span class="qt-voice-msg-label">Audio command</span><span class="qt-voice-msg-time">'+escapeHtml(item.timeLabel||timeNow())+'</span></div><div class="qt-voice-audio-row"><button class="qt-voice-play" type="button" aria-label="Play recording"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg></button><audio class="qt-voice-audio" controls preload="metadata"></audio></div><div class="qt-voice-loader-wrap"><div class="qt-voice-loader-track"><div class="qt-voice-loader-bar"></div></div></div><div class="qt-voice-status-row"><span class="qt-voice-status">'+escapeHtml(item.status||'Sending command')+'</span><span>'+escapeHtml(item.duration||'0:01')+'</span></div><details class="qt-voice-details"><summary>Command details</summary><div class="qt-voice-detail-grid"><span class="qt-voice-detail-key">Text</span><span class="qt-voice-detail-val">'+escapeHtml(item.text||'No transcript available')+'</span><span class="qt-voice-detail-key">Sent</span><span class="qt-voice-detail-val">'+escapeHtml(fmtDate(item.iso||dateNow()))+'</span><span class="qt-voice-detail-key">Status</span><span class="qt-voice-detail-val">'+escapeHtml(item.status||'Pending')+'</span></div></details>';
    messages.appendChild(box);requestAnimationFrame(()=>{messages.scrollTop=Math.max(0,box.offsetTop-messages.clientHeight+box.offsetHeight+12)});
    const audio=box.querySelector('audio'),play=box.querySelector('.qt-voice-play'),bar=box.querySelector('.qt-voice-loader-bar');
    if(item.audio){audio.src=item.audio;play.addEventListener('click',()=>audio.paused?audio.play():audio.pause());audio.addEventListener('play',()=>play.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3v14H7zm7 0h3v14h-3z"></path></svg>');audio.addEventListener('pause',()=>play.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>')}
    if(animate){bar.style.width='18%';requestAnimationFrame(()=>{bar.style.width='100%'})}
    else bar.style.width=item.status==='Sent command'?'100%':'35%';
    if(item.status==='Sending command'&&!animate)bar.style.width='65%';
    return {box,bar,audio};
  }

  async function sendRecording(){
    if(recorder&&recorder.state==='recording'){
      pendingSend=true;
      stopRecording(true);
      return;
    }
    if(!blob||isSending)return;
    const text=cleanTranscript(finalText+' '+interimText);
    if(!hasMeaningfulTranscript(text)){
      stateEl.textContent='● No voice detected';
      hint.textContent='No speech detected. Please try again.';
      inputShell.classList.add('voice-warning');
      showVoiceWarning();
      setTimeout(()=>inputShell.classList.remove('voice-warning'),1800);
      resetLocal(false);
      resetWave();
      return;
    }
    isSending=true;
    pendingSend=false;
    sendBtn.classList.remove('show');
    stateEl.textContent='● Sending';
    let audioData='';
    try{audioData=await dataUrlFromBlob(blob)}catch(e){}
    const item={audio:audioData,text:text||'Voice command',iso:dateNow(),timeLabel:timeNow(),duration:duration(Date.now()-startedAt),status:'Sending command',failed:false};
    const ui=addMessage(item,true);
    let ok=false;

      const zr=await window.ZV.handleSpeech(item.text);
      ok=!!zr.ok;item.matched=zr.label||'';item.reason=zr.reason||'';

    item.failed=!ok;
    const status=ui.box.querySelector('.qt-voice-status');
    const detailVals=ui.box.querySelectorAll('.qt-voice-detail-val');
    status.textContent=item.status;
    if(detailVals[2])detailVals[2].textContent=item.status;
    ui.box.classList.toggle('failed',!ok);
    ui.bar.style.width=ok?'100%':'25%';
    const history=readHistory();history.unshift({...item});writeHistory(history);
    isSending=false;
    stateEl.textContent=ok?'● Sent':'● Send failed';
    renderHistory();
    resetLocal(false);
  }

  function resetLocal(clearView){
    finalText='';interimText='';blob=null;chunks=[];startedAt=0;voiceDetected=false;sendBtn.classList.remove('show');pendingSend=false;if(clearView){messages.innerHTML='';}hint.textContent='Tap the mic to start';stateEl.textContent='● Ready';
  }

  function resetRecording(){if(recorder&&recorder.state==='recording')stopRecording(false);stopRecognition();resetLocal(false);resetWave()}

  function renderHistory(){
    const list=readHistory();historyList.innerHTML='';
    if(!list.length){historyList.innerHTML='';return}
    list.forEach(item=>{
      const row=document.createElement('div');row.className='qt-voice-history-item';row.innerHTML='<div class="qt-voice-history-main"><div class="qt-voice-history-title">'+escapeHtml(item.text||'Voice command')+'</div><div class="qt-voice-history-meta"><span>'+escapeHtml(fmtDate(item.iso))+'</span><span>'+escapeHtml(item.status||'Sent command')+'</span><span>'+escapeHtml(item.duration||'0:01')+'</span></div></div><audio class="qt-voice-history-audio" controls preload="metadata"></audio>';
      const a=row.querySelector('audio');if(item.audio)a.src=item.audio;historyList.appendChild(row);
    });
  }

  micBtn.addEventListener('click',()=>{if(recorder&&recorder.state==='recording'){if(autoSend.checked)stopRecording(false);else stopRecording(true)}else startRecording()});
  sendBtn.addEventListener('click',()=>{pendingSend=true;sendRecording()});
  resetBtn.addEventListener('click',resetRecording);
  autoSend.addEventListener('change',()=>{sendBtn.classList.toggle('show',!autoSend.checked&&!!recorder&&recorder.state==='recording')});
  speakTab.addEventListener('click',()=>setTab('speak'));historyTab.addEventListener('click',()=>setTab('history'));
  closeBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();closeVoice()},{capture:true});
  closeBtn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();closeVoice()},{capture:true});
  document.addEventListener('click',e=>{if(e.target===closeBtn||e.target.closest&&e.target.closest('#qtVoiceCloseBtn')){e.preventDefault();e.stopPropagation();closeVoice();}},true);
  window.addEventListener('resize',resizeCanvas);
    window.addEventListener('beforeunload',()=>{releaseMicrophone();});
})();
</script>
<script type="text/plain" id="zvCreatorDoc"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Create Gesture — Zippy</title>
<style>
  :root{
    --bg:#0e0f11;

  #app{display:flex;width:100vw;height:100vh;}
  #viewport{flex:1;position:relative;min-width:0;}

  #canvas-host canvas{display:block;width:100%;height:100%;}

    padding:6px 10px;border-radius:6px;

  }
  #panel-header{padding:20px 20px 12px;border-bottom:1px solid var(--border);}

  #panel-header p{font-size:12px;color:var(--text-dim);margin:0;line-height:1.5;}
  .section{padding:16px 20px;border-bottom:1px solid var(--border);}
  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin:0 0 12px;font-weight:600;}
  .finger-row{margin-bottom:14px;}
  .finger-row:last-child{margin-bottom:0;}
  .finger-label{
    display:flex;justify-content:space-between;align-items:baseline;

  }
  .finger-label span:last-child{color:var(--text-dim);font-size:11px;font-variant-numeric:tabular-nums;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:4px;border-radius:2px;
    background:var(--panel-2);outline:none;
    border:1px solid var(--border);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:var(--accent);cursor:pointer;
    border:2px solid var(--bg);
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:2px solid var(--bg);
  }
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  button{
    font-family:inherit;font-size:12px;font-weight:500;
    background:var(--panel-2);color:var(--text);
    border:1px solid var(--border);border-radius:6px;
    padding:8px 12px;cursor:pointer;
    transition:background 0.15s, border-color 0.15s;
  }
  button:hover{background:#26282c;border-color:#3a3c40;}
  button:active{transform:scale(0.98);}
  button.primary{background:var(--accent-dim);border-color:var(--accent-dim);color:#eafff5;}
  button.primary:hover{background:#0f7e60;}
  #cache-info{
    font-size:11px;color:var(--text-dim);line-height:1.6;
    background:var(--panel-2);border-radius:6px;padding:10px 12px;
    border:1px solid var(--border);
  }
  #cache-info code{color:var(--accent);font-family:"SF Mono",Consolas,monospace;font-size:10px;}
  .hint{font-size:11px;color:var(--text-dim);line-height:1.5;margin-top:10px;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#2a2c30;border-radius:4px;}

  /* ---------- Top bar ---------- */
  #topbar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--border);
    flex-wrap:wrap;row-gap:10px;
  }
  #topbar .tb-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  #topbar .tb-title{font-size:14px;font-weight:600;letter-spacing:-0.01em;}
  #topbar .tb-title span{color:var(--text-dim);font-weight:400;font-size:12px;margin-left:8px;}
  #topbar a.back-link{color:var(--text-dim);text-decoration:none;font-size:12px;border:1px solid var(--border);padding:7px 11px;border-radius:6px;}
  #topbar a.back-link:hover{color:var(--text);border-color:#3a3c40;}
  #topbar .tb-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

  .video-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);}
  .switch{position:relative;width:38px;height:22px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .track{position:absolute;inset:0;background:var(--panel-2);border:1px solid var(--border);border-radius:999px;transition:background .2s,border-color .2s;cursor:pointer;}
  .switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-dim);transition:transform .2s,background .2s;}
  .switch input:checked + .track{background:var(--accent-dim);border-color:var(--accent-dim);}
  .switch input:checked + .track .knob{transform:translateX(16px);background:#eafff5;}

  #app{height:calc(100vh - 49px);}

  /* ---------- Floating save-position pill (under a slider) ---------- */
  .save-pos-wrap{height:0;overflow:visible;position:relative;}
  .save-pos-pill{
    display:flex;align-items:center;gap:6px;
    max-height:0;opacity:0;transform:translateY(-4px);
    overflow:hidden;transition:max-height .22s ease,opacity .22s ease,transform .22s ease,margin-top .22s ease;
    margin-top:0;
  }
  .save-pos-pill.show{max-height:40px;opacity:1;transform:translateY(0);margin-top:8px;}
  .save-pos-pill button{
    font-size:11px;padding:6px 10px;background:var(--accent-dim);border-color:var(--accent-dim);color:#eafff5;
  }
  .save-pos-pill button:hover{background:#0f7e60;}
  .save-pos-pill .label{font-size:10.5px;color:var(--text-dim);}

  /* ---------- Sequence / timeline section ---------- */
  #sequence-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .seq-step{
    display:flex;align-items:center;gap:10px;
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;
  }
  .seq-step .seq-thumb{
    width:40px;height:40px;border-radius:6px;flex-shrink:0;overflow:hidden;
    background:#46433d;border:1px solid var(--border);
  }
  .seq-step .seq-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .seq-step .seq-body{flex:1;min-width:0;}
  .seq-step .seq-title{font-size:12px;font-weight:600;}
  .seq-step .seq-meta{font-size:10.5px;color:var(--text-dim);margin-top:2px;}
  .seq-step .seq-delay{display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .seq-step .seq-delay input{
    width:52px;background:var(--panel);border:1px solid var(--border);border-radius:5px;
    color:var(--text);font-size:11px;padding:4px 5px;text-align:right;
  }
  .seq-step .seq-delay span{font-size:10px;color:var(--text-dim);}
  .seq-step .seq-remove{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    border-radius:5px;padding:5px 7px;font-size:12px;line-height:1;flex-shrink:0;
  }
  .seq-step .seq-remove:hover{color:#e05252;border-color:#e05252;}
  .seq-empty{font-size:11.5px;color:var(--text-dim);padding:14px 10px;text-align:center;border:1px dashed var(--border);border-radius:8px;}
  .seq-step .seq-drag{cursor:grab;color:var(--text-dim);font-size:14px;padding:2px 4px;flex-shrink:0;user-select:none;}
  .seq-step.dragging{opacity:0.4;}
  .seq-step .seq-name-input{
    width:100%;background:transparent;border:none;border-bottom:1px dashed transparent;
    color:var(--text);font-size:12px;font-weight:600;font-family:inherit;padding:0;
  }
  .seq-step .seq-name-input:focus{outline:none;border-bottom-color:var(--accent);}
  .seq-step.group .seq-title-badge{
    display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.04em;
    background:var(--accent-dim);color:#eafff5;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;
  }

  .transport{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .transport button{padding:8px 12px;}
  .transport .scrub{font-size:11px;color:var(--text-dim);margin-left:auto;}

  /* ---------- Preview modal ---------- */
  #preview-overlay{
    position:fixed;inset:0;background:rgba(8,9,10,0.72);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:200;padding:24px;
  }
  #preview-overlay.open{display:flex;}
  #preview-modal{
    width:min(880px,100%);max-height:92vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:22px;
  }
  #preview-modal h2{font-size:16px;margin:0 0 4px;}
  #preview-modal p.sub{font-size:12px;color:var(--text-dim);margin:0 0 18px;}
  .preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:640px){.preview-grid{grid-template-columns:1fr;}}
  .preview-card{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .preview-card h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);margin:0 0 10px;}
  .preview-img-frame{width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#000;position:relative;}
  .preview-img-frame img,.preview-img-frame video{width:100%;height:100%;object-fit:cover;display:block;}
  .preview-card .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .angle-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .angle-chip{
    font-size:10.5px;padding:5px 9px;border-radius:999px;border:1px solid var(--border);
    background:var(--panel);color:var(--text-dim);cursor:pointer;
  }
  .angle-chip.active{background:var(--accent-dim);border-color:var(--accent-dim);color:#eafff5;}
  .preview-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .preview-footer button{padding:10px 16px;}

  /* ---------- Loader for video-mode thumbnails elsewhere (custom, no heart) ---------- */
  .gesture-loader{
    width:22px;height:22px;border-radius:50%;
    border:2px solid rgba(93,202,165,0.25);border-top-color:var(--accent);
    animation:gesture-spin .8s linear infinite;
  }
  @keyframes gesture-spin{to{transform:rotate(360deg);}}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(8px);
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    font-size:12px;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;z-index:300;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- Warning toast: slides in from the left edge ---------- */
  .warn-toast{
    position:fixed;top:64px;left:16px;
    display:flex;align-items:center;gap:8px;
    background:#3a2420;border:1px solid #7a3a2e;color:#ffd9cf;
    font-size:12px;padding:10px 14px;border-radius:8px;
    max-width:340px;line-height:1.4;
    transform:translateX(-120%);opacity:0;
    transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s ease;
    z-index:300;box-shadow:0 6px 18px rgba(0,0,0,0.35);
    pointer-events:none;
  }
  .warn-toast.show{transform:translateX(0);opacity:1;}

  /* ---- Gesture Library picker ---- */
  .lib-overlay{position:fixed;inset:0;background:rgba(10,10,12,.72);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:400;padding:24px;}
  .lib-overlay.open{display:flex;}
  .lib-box{width:min(680px,100%);max-height:86vh;display:flex;flex-direction:column;
    background:#1a1a1e;border:1px solid #2e2e34;border-radius:14px;overflow:hidden;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.8);}
  .lib-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 18px;border-bottom:1px solid #2e2e34;}
  .lib-bar h3{margin:0;font-size:15px;font-weight:600;color:#f2f2f4;}
  .lib-close{background:none;border:0;color:#9a9aa2;font-size:15px;cursor:pointer;padding:4px 8px;}
  .lib-close:hover{color:#f2f2f4;}
  .lib-note{margin:0;padding:12px 18px 4px;font-size:12px;line-height:1.5;color:#9a9aa2;}
  .lib-list{overflow:auto;padding:12px 18px 18px;display:flex;flex-direction:column;gap:10px;}
  .lib-item{display:flex;align-items:center;gap:14px;padding:10px;border:1px solid #2e2e34;
    border-radius:10px;background:#202026;cursor:pointer;transition:border-color .15s,background .15s;}
  .lib-item:hover{border-color:#4a9a7a;background:#24242b;}
  .lib-thumb{width:72px;height:72px;flex:0 0 72px;border-radius:8px;background:#46433d;
    object-fit:cover;display:block;}
  .lib-meta{min-width:0;flex:1;}
  .lib-name{font-size:14px;font-weight:600;color:#f2f2f4;margin-bottom:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lib-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9a9aa2;line-height:1.6;}
  .lib-load{flex:0 0 auto;padding:7px 14px;border-radius:7px;border:0;background:#2f9e6e;
    color:#fff;font-size:12px;font-weight:600;cursor:pointer;}
  .lib-empty{padding:26px 4px;text-align:center;color:#9a9aa2;font-size:13px;line-height:1.6;}
</style>
<style>#preview-save-publish{display:none!important}</style></head>
<body>

<div id="topbar">
  <div class="tb-left">
    <div class="tb-title">Create Gesture<span>Zippy Gesture Library</span></div>
  </div>
  <div class="tb-right">
    <button id="upload-gesture-btn">Upload a gesture from Gesture Library</button>
    <button class="back-link" id="gesture-library-btn" type="button">✕ Close</button>
    <button id="save-gesture-top" class="primary">Save Gesture</button>
  </div>
</div>

<div id="app">
  <div id="viewport">
    <div id="canvas-host"></div>
    <div id="status" class="loading"><div class="dot"></div><span id="status-text">Building hand model…</span></div>
  </div>

  <div id="panel">
    <div id="panel-header">
      <h1>Create a gesture</h1>
      <p>Move any joint below, then tap <strong>Save position</strong> to lock that pose in as the next step of the motion. Build up as many steps as you like, set the delay between each, then preview and publish.</p>
    </div>

    <div class="section" id="sequence-section">
      <p class="section-title">Motion sequence</p>
      <div class="btn-row" style="margin-bottom:12px">
        <button id="save-group-btn" class="primary">Save Group</button>
      </div>
      <div class="hint" style="margin-top:0;margin-bottom:12px">Move several joints without tapping the per-slider Save position button, then tap <strong>Save Group</strong> to capture everything that changed since the last step as one combined move, played back smoothly.</div>
      <div id="sequence-list">
        <div class="seq-empty" id="sequence-empty">No positions saved yet — move a joint and tap Save position, or move several and tap Save Group.</div>
      </div>
      <div class="hint">Drag the ⠿ handle to reorder steps. Click a step's name to rename it. Steps play back with smooth, interpolated motion between each position — not an instant jump — using the delay set on each step.</div>
      <div class="transport">
        <button id="play-sequence">▶ Play</button>
        <button id="pause-sequence" disabled>❚❚ Pause</button>
        <span class="scrub" id="sequence-count">0 steps</span>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Fingers</p>
      <div class="finger-row">
        <div class="finger-label"><span>Thumb</span><span id="out-thumb">0°</span></div>
        <input type="range" id="thumb" min="0" max="90" value="0" step="1">
        <div class="save-pos-wrap"><div class="save-pos-pill" data-for="thumb"><button class="save-pos-btn">Save position</button><span class="label">as next step</span></div></div>
      </div>
      <div class="finger-row">
        <div class="finger-label"><span>Index</span><span id="out-index">0°</span></div>
        <input type="range" id="index" min="0" max="100" value="0" step="1">
        <div class="save-pos-wrap"><div class="save-pos-pill" data-for="index"><button class="save-pos-btn">Save position</button><span class="label">as next step</span></div></div>
      </div>
      <div class="finger-row">
        <div class="finger-label"><span>Middle</span><span id="out-middle">0°</span></div>
        <input type="range" id="middle" min="0" max="100" value="0" step="1">
        <div class="save-pos-wrap"><div class="save-pos-pill" data-for="middle"><button class="save-pos-btn">Save position</button><span class="label">as next step</span></div></div>
      </div>
      <div class="finger-row">
        <div class="finger-label"><span>Ring</span><span id="out-ring">0°</span></div>
        <input type="range" id="ring" min="0" max="100" value="0" step="1">
        <div class="save-pos-wrap"><div class="save-pos-pill" data-for="ring"><button class="save-pos-btn">Save position</button><span class="label">as next step</span></div></div>
      </div>
      <div class="finger-row">
        <div class="finger-label"><span>Pinky</span><span id="out-pinky">0°</span></div>
        <input type="range" id="pinky" min="0" max="100" value="0" step="1">
        <div class="save-pos-wrap"><div class="save-pos-pill" data-for="pinky"><button class="save-pos-btn">Save position</button><span class="label">as next step</span></div></div>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Wrist</p>
      <div class="finger-row">
        <div class="finger-label"><span>Rotation</span><span id="out-wrist">70°</span></div>
        <input type="range" id="wrist-slider" min="0" max="180" value="90" step="1">
        <div class="save-pos-wrap"><div class="save-pos-pill" data-for="wrist-slider"><button class="save-pos-btn">Save position</button><span class="label">as next step</span></div></div>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Arm</p>
      <div class="finger-row">
        <div class="finger-label"><span>Elbow joint</span><span id="out-arm">0°</span></div>
        <input type="range" id="arm-slider" min="68" max="110" value="68" step="1">
        <div class="save-pos-wrap"><div class="save-pos-pill" data-for="arm-slider"><button class="save-pos-btn">Save position</button><span class="label">as next step</span></div></div>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Shoulder</p>
      <div class="finger-row">
        <div class="finger-label"><span>Rotation 1</span><span id="out-shoulder">0°</span></div>
        <input type="range" id="shoulder-slider" min="65" max="98" value="98" step="1" style="direction:rtl">
        <div class="save-pos-wrap"><div class="save-pos-pill" data-for="shoulder-slider"><button class="save-pos-btn">Save position</button><span class="label">as next step</span></div></div>
      </div>
      <div class="finger-row">
        <div class="finger-label"><span>Rotation 2 (lift)</span><span id="out-abduction">0°</span></div>
        <input type="range" id="abduction-slider" min="26" max="70" value="26" step="1">
        <div class="save-pos-wrap"><div class="save-pos-pill" data-for="abduction-slider"><button class="save-pos-btn">Save position</button><span class="label">as next step</span></div></div>
      </div>
      <div class="finger-row">
        <div class="finger-label"><span>Extend joint</span><span id="out-extend">0°</span></div>
        <input type="range" id="extend-slider" min="0" max="14" value="0" step="1">
        <div class="save-pos-wrap"><div class="save-pos-pill" data-for="extend-slider"><button class="save-pos-btn">Save position</button><span class="label">as next step</span></div></div>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Camera</p>
      <div class="btn-row">
        <button id="autofocus-toggle" class="primary">Follow camera: On</button>
      </div>
      <div class="hint">When on, the camera follows the motion — it stays square-on to the palm as the wrist turns, and tightens on whichever joints just moved. Drag or scroll the viewport to take manual control — it turns back on automatically the next time you use a slider, or tap the button to disable it entirely.</div>

      <div class="video-toggle" style="margin-top:14px">
        <label class="switch">
          <input type="checkbox" id="camera-mode-toggle">
          <span class="track"><span class="knob"></span></span>
        </label>
        <span id="camera-mode-label">Follow camera</span>
      </div>
      <div class="hint" id="camera-mode-hint">Follow camera: the shot tracks the palm and tightens on whatever joints just moved, for close-up detail shots. Switch off for one distant, unmoving wide angle that keeps the whole arm — shoulder to fingertips — in frame for every photo and every frame of the motion, so you can watch the entire arm move without the camera cutting or panning.</div>

      <div class="finger-row" style="margin-top:14px">
        <div class="finger-label"><span>Arm shot zoom</span><span id="out-arm-zoom">100%</span></div>
        <input type="range" id="arm-zoom-slider" min="50" max="200" value="100" step="5">
        <div class="hint" style="margin-top:6px">Zooms the arm/elbow and full-arm camera views in or out. Doesn't affect the finger close-up.</div>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Presets</p>
      <div class="btn-row">
        <button id="preset-open">Open</button>
        <button id="preset-fist">Fist</button>
        <button id="preset-point">Point</button>
        <button id="preset-peace">Peace</button>
        <button id="preset-thumbsup" class="primary">Thumbs up</button>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Device cache</p>
      <div id="cache-info">Checking <code>IndexedDB</code> for a cached model…</div>
      <div class="hint">This build generates the mesh procedurally, so there's nothing to download. If you swap in a real .glb file later, use the <code>loadHandModel()</code> function below — it already caches the file in IndexedDB on first load and reads from disk on every visit after that.</div>
    </div>
  </div>
</div>

<!-- ---------- Final preview / publish modal ---------- -->
<div id="preview-overlay">
  <div id="preview-modal">
    <h2>Preview your gesture</h2>
    <p class="sub">Check the cover image and the looping motion before you save. You can recapture the image or change camera angles at any point.</p>

    <div class="preview-grid">
      <div class="preview-card" style="grid-column:1/-1">
        <h3>Steps — reorder &amp; rename</h3>
        <div id="preview-sequence-list" style="display:flex;flex-direction:column;gap:8px"></div>
        <div class="hint">Same list as the editor — drag ⠿ to reorder, click a name to rename. Changes here apply to the saved gesture.</div>
      </div>
      <div class="preview-card">
        <h3>Image preview</h3>
        <div class="preview-img-frame" id="preview-img-frame">
          <img id="preview-img" alt="Gesture preview">
        </div>
        <div class="row">
          <button id="recapture-btn">Capture again</button>
        </div>
        <div class="angle-row" id="image-angle-row">
          <span class="angle-chip" data-angle="auto">Best angle</span>
          <span class="angle-chip" data-angle="front">Front</span>
          <span class="angle-chip" data-angle="side">Side</span>
          <span class="angle-chip" data-angle="wide">Wide</span>
        </div>
      </div>

      <div class="preview-card">
        <h3>Motion preview</h3>
        <div class="preview-img-frame" id="preview-video-frame">
          <canvas id="preview-video-canvas" style="width:100%;height:100%;display:block;object-fit:cover;"></canvas>
        </div>
        <div class="row">
          <button id="preview-play">▶ Play loop</button>
          <button id="preview-pause" disabled>❚❚ Pause</button>
          <button id="preview-camera-mode-toggle">Fixed camera: Off</button>
        </div>
        <div class="hint" id="preview-camera-mode-hint">Fixed camera off: the shot tracks whatever joints just moved. Turn on for one unmoving wide angle that keeps the whole arm in frame for every frame of the motion.</div>
        <div class="angle-row" id="video-angle-row">
          <span class="angle-chip" data-angle="auto">Auto per-step</span>
          <span class="angle-chip" data-angle="front">Front</span>
          <span class="angle-chip" data-angle="side">Side</span>
          <span class="angle-chip" data-angle="wide">Wide</span>
        </div>
        <div class="hint">This replays the actual recorded joint values step by step — the same pose data driving the real device — easing smoothly between each saved position using its delay, on a loop. It's not a baked video file: anywhere this gesture is shown later re-plays these exact values live.</div>
      </div>
    </div>

    <div class="preview-footer">
      <button id="preview-cancel">Keep editing</button>
      <button id="preview-save-gesture" class="primary">Save Gesture</button>
      <button id="preview-save-publish" class="primary">Save & Publish to Library</button>
    </div>
  </div>
</div>

<!-- ===== Gesture Library picker =====
     Replaces the old window.prompt("enter a number") list. A prompt could
     only ever hand back a number, so there was no way to show how many
     steps a gesture had, how long it ran, or what it looked like before
     committing to loading it. -->
<div class="lib-overlay" id="lib-overlay">
  <div class="lib-box">
    <div class="lib-bar">
      <h3>Load a gesture from your library</h3>
      <button class="lib-close" id="lib-close" aria-label="Close">&#10005;</button>
    </div>
    <p class="lib-note">Everything loads into the editor — every step, its pose, its delay and its captured photo. Edit freely and save it as a new gesture; the original in your library is left untouched.</p>
    <div class="lib-list" id="lib-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="warn-toast" id="warn-toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
<script>

    palmShape.lineTo(-0.68, 0.78);
    palmShape.lineTo(-0.48, 1.06);
    palmShape.lineTo(-0.15, 1.12);
    palmShape.lineTo(0.15, 1.12);
    palmShape.lineTo(0.48, 0.98);
    palmShape.lineTo(0.70, 0.78);
    palmShape.lineTo(0.75, 0.05);
    palmShape.lineTo(0.72, -0.55);
    palmShape.lineTo(0.50, -0.95);
    palmShape.lineTo(0.22, -1.12);
    palmShape.lineTo(-0.22, -1.12);
    palmShape.lineTo(-0.60, -0.95);

    var palmGeo = new THREE.ExtrudeGeometry(palmShape, {
      depth: 0.5,
      bevelEnabled: true,
      bevelThickness: 0.05,
      bevelSize: 0.04,
      bevelSegments: 2,
      curveSegments: 1 // straight facets, no smoothing
    });
    palmGeo.translate(0, 0, -0.25);
    var palm = new THREE.Mesh(palmGeo, skinMat);
    palm.castShadow = true; palm.receiveShadow = true;
    handGroup.add(palm);

    // Invisible anchor marking the palm's center + facing direction (local
    // +Z), used purely as a camera-tracking reference so auto-focus can
    // always park the camera square-on to the palm regardless of wrist
    // rotation or elbow bend.
    palmAnchor = new THREE.Object3D();
    palmAnchor.position.set(0, 0.05, 0.1);
    handGroup.add(palmAnchor);

    // Panel seam lines: thin darker inset boxes tracing plate divisions,
    // like the printed-part seams visible on the reference hand.
    function seam(x, y, w, h, rotZ){
      var seamGeo = new THREE.BoxGeometry(w, h, 0.02);
      var seamMesh = new THREE.Mesh(seamGeo, slotMat);
      seamMesh.position.set(x, y, 0.24);
      if (rotZ) seamMesh.rotation.z = rotZ;
      handGroup.add(seamMesh);
    }
    seam(-0.15, 0.05, 0.75, 0.03, 0.35);
    seam(0.25, -0.35, 0.55, 0.03, -0.5);
    seam(-0.55, -0.3, 0.03, 0.6, 0);

    // (Grip pads removed per feedback — plain plastic shell only.)
  })();

  // wrist — black cuff/socket like the prosthetic's forearm interface.
  // Lives on wristGroup (fixed), not handGroup, because it represents the
  // static socket housing that the hand rotates INSIDE of — like a real
  // wrist turning within a fixed cuff, not the cuff itself spinning. Its
  // faceted low-poly cylinder was catching a flat-looking specular highlight
  // that visibly swung around when it was wrongly parented to the
  // rotating handGroup; keeping it on the fixed wristGroup stops that.
  var cuffGeo = new THREE.CylinderGeometry(0.56, 0.6, 0.55, 16);
  var cuff = new THREE.Mesh(cuffGeo, jointMat);
  cuff.position.set(0, -1.75, 0);
  cuff.castShadow = true;
  wristGroup.add(cuff);

  // collar — a thin plastic ring right where the hand meets the cuff.
  // This one DOES belong on handGroup: it's the hand-side lip of the
  // joint, so it should turn together with the hand as it rotates, right
  // up against the fixed cuff below it. Shortened and repositioned so it
  // sits flush ABOVE the cuff with no vertical overlap (previously the two
  // low-poly cylinders interpenetrated between y=-1.6 and y=-1.475, and
  // since one rotates while the other stays fixed, that overlapping
  // faceted geometry visibly slid/rotated in place instead of looking
  // like a flat, static seam).
  var collarGeo = new THREE.CylinderGeometry(0.5, 0.56, 0.3, 16);
  var collar = new THREE.Mesh(collarGeo, skinMat);
  collar.position.set(0, -1.475 + 0.15, 0); // bottom face sits exactly at the cuff's top face (y=-1.475), no gap or overlap
  collar.castShadow = true;
  handGroup.add(collar);

  // ---------- Arm rig ----------
  // Anatomy fix: the bicep (upper arm) attaches to the shoulder and stays
  // straight. The elbow bends the FOREARM (which carries the wrist+hand
  // with it), not the bicep. Structure, top to bottom:
  //   shoulderAnchor (fixed, future shoulder attaches here)
  //     -> bicep mesh (straight, never rotates)
  //     -> elbowPivot
  //          -> elbow ball
  //          -> forearmPivot   (THIS is what the elbow slider rotates)
  //               -> forearm mesh
  //               -> wristGroup (cuff/collar) -> handGroup (hand+fingers)
  // The whole rig is then flipped 180° so the bicep/shoulder end is on top
  // and the hand hangs naturally below it, ready for a shoulder to attach
  // above.
  var forearmMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness:0.45, metalness:0.06 });
  var forearmJointMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness:0.4, metalness:0.3 });

  // armAssembly is a plain positioning offset (no rotation) so the whole
  // rig sits nicely in the default camera framing. The "upside down, hand
  // hanging below the shoulder" orientation comes from how the chain below
  // is actually built (shoulder at the top, decreasing Y all the way to
  // the fingertips) plus a 180° flip on wristGroup — not from rotating
  // this outer group, which is what caused the hand to fold back into the
  // forearm and interpenetrate it last time.
  var armAssembly = new THREE.Group();
  armAssembly.position.set(0, 6.8, 0);
  // Mirror the ENTIRE rig (shoulder cap/quadrant, bicep, elbow, forearm,
  // wrist, hand, all fingers) across X so this reads as a RIGHT arm/hand
  // instead of a left one. Three.js correctly flips backface culling for
  // negative-determinant matrices, so materials/shadows still render fine.
  //
  // IMPORTANT — why this does NOT uniformly flip every joint's rotation
  // direction: a limb hangs at rest along local -Y. For a rotation about
  // axis A, the instantaneous world-space motion direction is A × v (v =
  // the limb's current direction). Mirroring negates only the X component
  // of that result:
  //   - Abduction rotates about Z: A×v = Z×(0,-1,0) = (1,0,0) — mirroring
  //     negates this entirely, so the visual direction DOES flip.
  //   - Elbow rotates about X: A×v = X×(0,-1,0) = (0,0,-1) — the X
  //     component is already 0, so mirroring changes NOTHING here; the
  //     visual direction does NOT flip.
  // So only the abduction slider needed its sign negated to compensate —
  // the elbow slider needed no compensation at all. (Verified by working
  // through the cross products rather than guessing from screenshots.)
  armAssembly.scale.x = -1;
  scene.add(armAssembly);

  // Shoulder assembly, top to bottom:
  //   armAssembly (fixed world position)
