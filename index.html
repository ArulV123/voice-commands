  //     -> abductionPivot   ("Rotation 2" — lifts the WHOLE arm out to the
  //                          side about Z, like a jumping-jack arm raise)
  //          -> white domed cap  (rounded shoulder cover, sits above the
  //                               black cylinder — matches the reference
  //                               photo: white rounded shape over a dark
  //                               joint housing)
  //          -> shoulderPivot   ("Rotation 1" — spins the whole arm about
  //                              its own long axis, Y)
  //               -> black cylinder housing (same diameter as the bicep's
  //                                           top end, low profile)
  //               -> shoulderAnchor -> bicep + elbow + forearm + wrist + hand
  var shoulderMat = new THREE.MeshStandardMaterial({ color: 0x161616, roughness:0.55, metalness:0.2 });
  var shoulderCapMat = new THREE.MeshStandardMaterial({ color: 0xf5f2ea, roughness:0.5, metalness:0.04 }); // white, matches skin shell tone
  var bicepTopRadius = 0.40; // matches the bicep's top radius exactly (see bicepProfile below)
  var shoulderCylRadius = bicepTopRadius;
  var shoulderCylHeight = 0.22; // less than half of the previous 0.55 box height

  // Rotation 2 pivot — this is the TOP of the assembly, so rotating it
  // carries the cap, the black cylinder, and everything below (bicep,
  // elbow, forearm, wrist, hand) out to the side together, like raising a
  // whole arm sideways from the shoulder.
  var abductionPivot = new THREE.Group();
  armAssembly.add(abductionPivot);

  // Extend joint: hinges the WHOLE assembly (joint housing + bicep down to
  // hand) forward together, about X, from the shoulder. Sits directly
  // under abductionPivot, above both the joint housing and shoulderPivot,
  // so bending it swings everything below as one rigid piece — no
  // counter-rotation needed for that part.
  var extendPivot = new THREE.Group();
  abductionPivot.add(extendPivot);

  // The cube/cylinder joint housing lives directly on extendPivot, as a
  // SIBLING of shoulderPivot (not a descendant of it) — so "Rotation 1"
  // (the shoulder slider, applied only inside shoulderPivot) spins the arm
  // (bicep down to hand) WITHOUT moving this housing at all, while the
  // extend joint (applied on their shared parent, extendPivot) still
  // carries both of them forward together. No counter-rotation math is
  // needed since the housing simply isn't inside shoulderPivot's subtree.
  var jointHousingGroup = new THREE.Group();
  extendPivot.add(jointHousingGroup);

  // Rotation 1 — spins ONLY the arm (bicep/elbow/forearm/hand) about its
  // own long axis (Y). Also a child of extendPivot, alongside
  // jointHousingGroup, so it still swings forward with the extend joint,
  // but its own Y-spin never touches the (sibling) joint housing.
  var shoulderPivot = new THREE.Group();
  extendPivot.add(shoulderPivot);

  var capRadius = shoulderCylRadius;

  // Small black cylinder lying on its side (axis along X), connected
  // face-to-face with one side of a small white cube. The cylinder's
  // flat circular end-cap (at local +X, since its axis runs along X after
  // the 90° rotation) touches the cube's -X face directly, with no gap.
  var sideCylRadius = capRadius * 0.6;
  var sideCylHeight = shoulderCylHeight * 0.9; // short, so it reads as a small connecting stub
  var shoulderSideCyl = new THREE.Mesh(
    new THREE.CylinderGeometry(sideCylRadius, sideCylRadius, sideCylHeight, 24),
    shoulderMat
  );
  shoulderSideCyl.rotation.z = Math.PI / 2; // lay on its side so its flat end-caps point along X
  shoulderSideCyl.position.set(-sideCylHeight/2, shoulderCylHeight/2, 0);
  shoulderSideCyl.castShadow = true;
  shoulderSideCyl.receiveShadow = true;
  jointHousingGroup.add(shoulderSideCyl);

  // Small white cube, connected flush to the cylinder's other end-cap
  // (world x = 0, i.e. the +X face of the cylinder once rotated), so the
  // cube's own -X face sits right at that plane with no gap.
  var cubeSize = capRadius * 1.1; // small cube
  var shoulderCap = new THREE.Mesh(
    new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize),
    shoulderCapMat
  );
  shoulderCap.position.set(cubeSize/2, shoulderCylHeight/2, 0);
  shoulderCap.castShadow = true;
  shoulderCap.receiveShadow = true;
  jointHousingGroup.add(shoulderCap);

  // Big black cylinder connected to the OPPOSITE face of the cube (its
  // +X face, at world x = cubeSize), also lying on its side (axis along
  // X) so its flat end-cap touches that face directly, no gap. Short in
  // height (a slim disc) but wide enough radius to just cover the cube
  // plus a small margin around it.
  var bigCylRadius = cubeSize * 0.8;
  var bigCylHeight = shoulderCylHeight * 0.9;
  var shoulderBigCyl = new THREE.Mesh(
    new THREE.CylinderGeometry(bigCylRadius, bigCylRadius, bigCylHeight, 24),
    shoulderMat
  );
  shoulderBigCyl.rotation.z = Math.PI / 2; // lay on its side so its flat end-caps point along X
  shoulderBigCyl.position.set(cubeSize + bigCylHeight/2, shoulderCylHeight/2, 0);
  shoulderBigCyl.castShadow = true;
  shoulderBigCyl.receiveShadow = true;
  jointHousingGroup.add(shoulderBigCyl);

  // Another cylinder connected to the OUTER face of shoulderBigCyl (at
  // world x = cubeSize + bigCylHeight), also lying on its side. Slightly
  // smaller radius than shoulderBigCyl, but taller/longer height.
  var extraCylRadius = bigCylRadius * 0.85;
  var extraCylHeight = bigCylHeight * 1.6;
  var shoulderExtraCyl = new THREE.Mesh(
    new THREE.CylinderGeometry(extraCylRadius, extraCylRadius, extraCylHeight, 24),
    shoulderMat
  );
  shoulderExtraCyl.rotation.z = Math.PI / 2; // lay on its side so its flat end-caps point along X
  shoulderExtraCyl.position.set(cubeSize + bigCylHeight + extraCylHeight/2, shoulderCylHeight/2, 0);
  shoulderExtraCyl.castShadow = true;
  shoulderExtraCyl.receiveShadow = true;
  jointHousingGroup.add(shoulderExtraCyl);

  // ---------- Stable cube on a ball-and-socket, at the far end ----------
  // A small ball-and-socket joint sits flush against the outer face of
  // shoulderExtraCyl, and a cube rides on the ball. The cube is "gyro
  // stabilized": no matter how the arm/shoulder/extend/abduction joints
  // rotate the chain above it, the cube itself never visibly spins or
  // tumbles — it keeps a constant world-space orientation, like a gimbal
  // weight that stays level. Only its POSITION follows the joint (it
  // still travels with the arm), never its rotation.
  var gyroSocketMat = shoulderMat;   // dark socket housing, matches other joints
  var gyroBallMat = jointMat;        // dark ball, matches other actuator housings

  // Socket cup — a short, wide cylinder flush against shoulderExtraCyl's
  // outer face, same radius family as the other stub joints so it reads
  // as part of the same mechanical chain.
  var gyroSocketRadius = extraCylRadius * 0.75;
  var gyroSocketDepth = extraCylRadius * 0.55;
  var gyroSocket = new THREE.Mesh(
    new THREE.CylinderGeometry(gyroSocketRadius, gyroSocketRadius, gyroSocketDepth, 20),
    gyroSocketMat
  );
  gyroSocket.rotation.z = Math.PI / 2; // lay on its side, flat face along X, matching the cylinder chain
  var gyroSocketX = cubeSize + bigCylHeight + extraCylHeight + gyroSocketDepth/2;
  gyroSocket.position.set(gyroSocketX, shoulderCylHeight/2, 0);
  gyroSocket.castShadow = true;
  gyroSocket.receiveShadow = true;
  jointHousingGroup.add(gyroSocket); // socket housing is part of the rigid joint chain — it CAN rotate with the arm

  // Ball — sits right at the socket's outer face, this is the pivot point
  // the cube hangs from.
  var gyroBallRadius = gyroSocketRadius * 0.85;
  var gyroBallX = gyroSocketX + gyroSocketDepth/2;
  var gyroBall = new THREE.Mesh(
    new THREE.SphereGeometry(gyroBallRadius, 20, 16),
    gyroBallMat
  );
  gyroBall.position.set(gyroBallX, shoulderCylHeight/2, 0);
  gyroBall.castShadow = true;
  gyroBall.receiveShadow = true;
  jointHousingGroup.add(gyroBall); // the ball itself is fixed to the housing, same as the socket

  // gyroCubeAnchor: a plain, unrotated group placed directly in the SCENE
  // (not anywhere in the arm hierarchy), positioned every frame to match
  // the ball's live world position but with IDENTITY world rotation. This
  // is what makes the cube "stable" — its position tracks the joint, but
  // its orientation is completely decoupled from every rotation above it
  // (shoulder spin, extend hinge, abduction lift), so it never appears to
  // tumble or spin — like a gyroscope staying level while its mount moves.
  var gyroCube = new THREE.Mesh(
    new THREE.BoxGeometry(cubeSize*0.9, cubeSize*0.9, cubeSize*0.9),
    shoulderCapMat // same white plastic as the other cube, for visual consistency
  );
  gyroCube.castShadow = true;
  gyroCube.receiveShadow = true;
  scene.add(gyroCube); // scene-level: parenting it here means arm rotations never touch its local transform at all

  // Thin dark pivot pin through the ball, visually bridging ball -> cube
  // even though they're not in the same local space — redrawn every frame
  // at the ball's current world position, oriented to always point at the
  // cube (so the "stalk" visibly follows along without itself looking like
  // it's rigidly rotating with the arm).
  var gyroPinRadius = gyroBallRadius * 0.25;
  var gyroPin = new THREE.Mesh(
    new THREE.CylinderGeometry(gyroPinRadius, gyroPinRadius, 1, 10), // unit length, rescaled per-frame
    gyroBallMat
  );
  gyroPin.castShadow = true;
  scene.add(gyroPin);

  var gyroBallWorld = new THREE.Vector3();
  // World-space offset direction the cube sits out from the ball. The
  // whole housing chain (cube/cylinders/socket/ball) is built along
  // jointHousingGroup's local +X, which armAssembly's mirror (scale.x=-1)
  // flips into world -X — so continuing "outward" in that same direction
  // means the offset here must also be NEGATIVE X, not positive. Positive
  // X was pointing back in toward the body/bicep, which is what put the
  // cube inside the arm at rest instead of clear of it.
  var gyroCubeOffset = new THREE.Vector3(-(gyroBallRadius + cubeSize*2.2), 0, 0);

  function updateGyroCube(){
    scene.updateMatrixWorld(true);
    gyroBall.getWorldPosition(gyroBallWorld);
    // Cube position: fixed offset from the ball in WORLD space (not the
    // ball's local +X, which would rotate with the arm) — so it always
    // sits out past the ball on a constant world direction, then just
    // slides along as the ball itself moves through space.
    gyroCube.position.copy(gyroBallWorld).add(gyroCubeOffset);
    gyroCube.rotation.set(0,0,0); // never rotates — this is the "gyro stabilized" part

    // Pin: stretch a unit cylinder to bridge ball -> cube exactly, using
    // lookAt-style alignment (cylinders default to pointing along +Y).
    var mid = gyroBallWorld.clone().lerp(gyroCube.position, 0.5);
    var dist = gyroBallWorld.distanceTo(gyroCube.position);
    gyroPin.position.copy(mid);
    gyroPin.scale.set(1, dist, 1);
    var dir = gyroCube.position.clone().sub(gyroBallWorld).normalize();
    var up = new THREE.Vector3(0,1,0);
    gyroPin.quaternion.setFromUnitVectors(up, dir);
  }

  var shoulderBlock = new THREE.Mesh(
    new THREE.CylinderGeometry(shoulderCylRadius, shoulderCylRadius, shoulderCylHeight, 24),
    shoulderMat
  );
  shoulderBlock.position.set(0, shoulderCylHeight/2, 0); // sits directly above the bicep's top
  shoulderBlock.castShadow = true;
  shoulderBlock.receiveShadow = true;
  // On shoulderPivot so it spins together with the bicep under Rotation 1
  // (they're meant to rotate as one rigid piece), and also swings forward
  // with the extend joint since shoulderPivot itself is a child of
  // extendPivot.
  shoulderPivot.add(shoulderBlock);

  var shoulderAnchor = new THREE.Group(); // future shoulder attachment point; bicep/elbow/forearm/hand all hang from here
  shoulderPivot.add(shoulderAnchor);

  // Flush end-cap disc: closes the open hollow top of the bicep lathe
  // (which previously showed through as a small, oddly-placed dark circle)
  // with a disc whose radius exactly matches the CYLINDER's radius (not
  // the quadrant's, which is now larger/independent), centered on the same
  // vertical axis — so it aligns perfectly with the cylinder's own rim.
  var shoulderCapDisc = new THREE.Mesh(
    new THREE.CircleGeometry(shoulderCylRadius, 24),
    shoulderCapMat
  );
  shoulderCapDisc.rotation.x = -Math.PI/2; // lie flat, facing up
  shoulderCapDisc.position.set(0, 0.001, 0); // sits right at the bicep-top / cylinder-bottom seam
  shoulderCapDisc.receiveShadow = true;
  shoulderAnchor.add(shoulderCapDisc);


  function setShoulderRotation(deg){
    // Same mapping as setWristRotation: 90° is neutral (arm hangs straight),
    // slider range 0–180 swings it symmetrically either side. shoulderPivot
    // is a sibling of jointHousingGroup (both children of extendPivot), so
    // this spin never touches the joint housing at all — no counter-
    // rotation math needed.
    shoulderPivot.rotation.y = (deg - 90) * Math.PI / 180;
  }

  function setAbductionRotation(deg){
    // 0° = arm hanging straight down (neutral); 90° = fully lifted out to
    // the side (jumping-jack style). Range is 0–90 only now, so 0 itself
    // is the resting position rather than the midpoint of a wider range.
    // Negated: armAssembly is mirrored (scale.x = -1) to make this a right
    // arm, and that mirror flips the visual sense of a Z-axis rotation, so
    // without the flip here the arm was lifting toward the wrong side.
    abductionPivot.rotation.z = -deg * Math.PI / 180;
  }

  // Extend joint: hinges the whole assembly (joint housing + bicep down to
  // hand) forward together at extendPivot, all as one rigid piece, since
  // both jointHousingGroup and shoulderPivot are children of extendPivot.
  // 0° = resting straight down (neutral), sweeping forward as the slider
  // increases, up to 180°.
  function setExtendJoint(deg){
    extendPivot.rotation.x = deg * Math.PI / 180;
  }

  var elbowBallRadius = 0.4;
  var cuffBottomRadius = 0.6; // matches the wrist cuff's bottom radius exactly
  var jointGap = 0.34; // visible open space between bicep and forearm sockets, showing the ball joint

  // Bicep — fixed, straight, never bends. Muscular lathe profile (belly in
  // the middle, necking toward the shoulder cut and toward a socket cup
  // that stops short of the elbow ball, leaving it visibly exposed).
  var bicepLen = 2.0;
  var bicepProfile = [
    new THREE.Vector2(0.40,                 0),
    new THREE.Vector2(0.48,                -bicepLen*0.18),
    new THREE.Vector2(0.55,                -bicepLen*0.42), // muscle belly
    new THREE.Vector2(0.50,                -bicepLen*0.68),
    new THREE.Vector2(0.40,                -bicepLen*0.88),
    new THREE.Vector2(elbowBallRadius*1.15, -bicepLen*0.97), // socket cup rim
    new THREE.Vector2(elbowBallRadius*0.7,  -bicepLen)        // socket floor — stops before the ball
  ];
  var bicepGeo = new THREE.LatheGeometry(bicepProfile, 20);
  var bicep = new THREE.Mesh(bicepGeo, forearmMat);
  bicep.castShadow = true;
  bicep.receiveShadow = true;
  shoulderAnchor.add(bicep);

  // Elbow pivot — sits in open space BELOW the bicep socket, out past the
  // gap, so the ball joint is fully visible rather than nested flush
  // inside the bicep housing.
  var elbowPivot = new THREE.Group();
  elbowPivot.position.set(0, -bicepLen - jointGap, 0);
  shoulderAnchor.add(elbowPivot);

  var elbowBall = new THREE.Mesh(new THREE.SphereGeometry(elbowBallRadius, 24, 18), forearmJointMat);
  elbowBall.castShadow = true;
  elbowPivot.add(elbowBall);

  // A short connecting rod/axle through the gap keeps the ball from
  // reading as floating disconnected while still leaving it clearly
  // showcased — a thin metal shaft, not a full-radius plastic shell.
  var elbowAxle = new THREE.Mesh(new THREE.CylinderGeometry(elbowBallRadius*0.22, elbowBallRadius*0.22, jointGap*1.4, 12), forearmJointMat);
  elbowAxle.position.set(0, jointGap*0.7, 0);
  elbowAxle.castShadow = true;
  elbowPivot.add(elbowAxle);

  // Forearm pivot — THIS is what the Arm slider rotates. At rotation.x = 0
  // the forearm continues straight in line with the bicep (fully extended
  // arm); increasing the slider bends the elbow, swinging the forearm
  // (and the wrist + hand riding on it) — the bicep never moves.
  var forearmPivot = new THREE.Group();
  elbowPivot.add(forearmPivot);

  // Forearm mesh — human-proportioned: two visible muscle masses (radius/
  // ulna bulk) just below the elbow that are wider than the elbow ball
  // itself, a gentle taper through the mid-forearm, then narrowing again
  // to the wrist. A slight forward bow (Z offset) instead of a dead-straight
  // lathe reads far more like a real forearm than a uniform taper.
  var forearmLen = 2.6;
  var socketRadius = elbowBallRadius * 1.15; // socket cup that cradles the ball from below, mirrors the bicep's cup
  var forearmProfile = [
    new THREE.Vector2(socketRadius*0.7,          0),            // socket floor, meets the ball from underneath
    new THREE.Vector2(socketRadius,              forearmLen*0.03),
    new THREE.Vector2(cuffBottomRadius*0.98,     -forearmLen*0.10), // muscle bulk just below elbow (wider than ball)
    new THREE.Vector2(cuffBottomRadius*1.05,     -forearmLen*0.22), // peak bulk
    new THREE.Vector2(cuffBottomRadius*0.88,     -forearmLen*0.45),
    new THREE.Vector2(cuffBottomRadius*0.80,     -forearmLen*0.66), // narrowest mid-point
    new THREE.Vector2(cuffBottomRadius*0.86,     -forearmLen*0.85),
    new THREE.Vector2(cuffBottomRadius,          -forearmLen)
  ];
  var forearmGeo = new THREE.LatheGeometry(forearmProfile, 22);
  // Slight forward bow: bend the lathe profile along Z so the forearm
  // isn't a perfectly straight rod (subtle, but reads as a real limb).
  var fPos = forearmGeo.attributes.position;
  for (var fi=0; fi<fPos.count; fi++){
    var fy = fPos.getY(fi);
    var t = -fy / forearmLen; // 0 at elbow, 1 at wrist
    var bow = Math.sin(t * Math.PI) * 0.05;
    fPos.setZ(fi, fPos.getZ(fi) + bow);
  }
  fPos.needsUpdate = true;
  forearmGeo.computeVertexNormals();
  var forearm = new THREE.Mesh(forearmGeo, forearmMat);
  forearm.position.y = -jointGap; // sits below the exposed ball/axle gap
  forearm.castShadow = true;
  forearm.receiveShadow = true;
  forearmPivot.add(forearm);

  // Attach the hand to the bottom of the forearm. wristGroup is rotated
  // 180° here so its own internal "cuff end -> fingertip end" direction
  // points AWAY from the elbow once attached (this is what makes the hand
  // hang down properly instead of folding back over the forearm — the bug
  // in the previous version). The cuff's bottom face sits at local
  // y = -1.75 - 0.275 = -2.025 inside wristGroup (pre-rotation); after the
  // 180° flip that point lands at (wristGroup.position.y + 2.025), which
  // is set to exactly match the forearm's far end (-forearmLen) so the two
  // circles coincide with no gap:
  //   wristGroup.position.y + 2.025 = -forearmLen - jointGap
  //   wristGroup.position.y = -forearmLen - jointGap - 2.025
  wristGroup.rotation.x = Math.PI;
  wristGroup.position.set(0, -forearmLen - jointGap - 2.025, 0);
  forearmPivot.add(wristGroup);

  // world-space Y of the elbow pivot, used for camera focus-shift targeting.
  armAssembly.updateMatrixWorld(true);
  var elbowWorldVec = new THREE.Vector3();
  elbowPivot.getWorldPosition(elbowWorldVec);
  var elbowWorldY = elbowWorldVec.y;

  // ---------- Elbow: fixed camera position (like wrist/shoulder/abduction) ----------
  // Previously this reused the generic manual-orbit variables (camTheta/
  // camPhi/camDist), which can be left in a stale state by prior dragging
  // or other focus views, and that stale state pointed the camera at empty
  // background instead of the elbow. Replaced with its own static,
  // purpose-built position/look-at, exactly like the other joints.
  // Look-at target is the elbow BALL JOINT itself, kept as the visual
  // center of the shot. Since elbow flexion swings the forearm forward/
  // back in Z (rotation about X), a view "from the side" means placing the
  // camera out along X at roughly the ball's own height, looking back
  // across at the joint — this shows the ball-and-socket edge-on, with the
  // forearm swinging toward/away from camera rather than side-to-side, and
  // still leaves the hand visible below as it swings through that arc.
  var armSwingSpan = forearmLen + jointGap + 2.025; // elbow down to roughly the hand center
  // Offsets from the elbow's live world position rather than an absolute
  // coordinate baked in from the rest pose — otherwise this view goes
  // stale (still pointing at the OLD elbow height/position) as soon as the
  // shoulder rotation or abduction lift has moved the elbow elsewhere.
  //
  // Look-at is centered between the elbow joint and the hand below it so
  // both joints (elbow ball-and-socket above, wrist/hand below) are
  // clearly visible in frame together. Elbow flexion rotates about X,
  // swinging the forearm through the Y-Z plane, so a camera placed purely
  // along X (perpendicular to that swing plane, with zero Z offset) shows
  // the bend as a flat, straight-on profile — not foreshortened or
  // angled — with the forearm swinging directly toward/away from camera.
  // Straight-on profile view: camera sits purely along X (perpendicular to
  // the elbow's swing plane, which is Y-Z), with NO Z offset. Camera is
  // raised closer to the elbow's own height (rather than noticeably below
  // it) so the shot doesn't tilt upward looking at the joint — a level,
  // flat "plane" shot with both the bicep-side and forearm-side joints
  // clearly visible, instead of a low angle looking up.
  var ARM_VIEW_POS_OFFSET = new THREE.Vector3(6.5, armSwingSpan * 0.32, 0);
  var ARM_VIEW_LOOKAT_OFFSET = new THREE.Vector3(0, armSwingSpan * 0.05, 0);

  // small dark screw/pivot dot on the side of the wrist, echoing the
  // reference photo's visible hardware
  var screw = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.08,10), jointMat);
  screw.rotation.z = Math.PI/2;
  screw.position.set(0.55, -0.05, 0.1);
  handGroup.add(screw);

  // Finger builder: returns { root(Object3D), joints:[pivot1,pivot2,pivot3] }
  // rot lets us pass a full euler rotation (used for the thumb, which needs
  // to angle out from the side of the palm rather than just splay like a finger)
  function buildFinger(segLens, segRad, baseX, baseY, baseZ, splay, rot){
    var root = new THREE.Group();
    root.position.set(baseX, baseY, baseZ);
    if (rot){
      root.rotation.set(rot.x||0, rot.y||0, rot.z||0);
    } else {
      root.rotation.z = splay || 0;
    }
    handGroup.add(root);

    var joints = [];
    var parent = root;
    for (var i=0;i<segLens.length;i++){
      var len = segLens[i];
      var rTop = segRad[i];
      var rBot = segRad[i+1] !== undefined ? segRad[i+1] : segRad[i]*0.85;

      var pivot = new THREE.Group();
      parent.add(pivot);

      // segment shell — full-length cylinder so each segment connects
      // directly to the joint above/below it with no visible gap
      var geo = new THREE.CylinderGeometry(rTop, rBot, len, 8);
      geo.translate(0, len/2, 0);
      var mesh = new THREE.Mesh(geo, skinMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      pivot.add(mesh);

      // black joint pivot (knuckle) — cylindrical hinge barrel instead of
      // a smooth sphere, plus a thin exposed wire, matching the visible
      // mechanism at each finger joint in the reference photo.
      var hinge = new THREE.Mesh(new THREE.CylinderGeometry(rTop*0.92, rTop*0.92, rTop*1.7, 8), jointMat);
      hinge.rotation.z = Math.PI/2;
      hinge.castShadow = true;
      pivot.add(hinge);
      var jWire = new THREE.Mesh(new THREE.CylinderGeometry(rTop*0.1, rTop*0.1, len*0.7, 5), wireMat);
      jWire.position.set(0, len*0.45, rTop*0.75);
      pivot.add(jWire);

      joints.push(pivot);

      var next = new THREE.Group();
      next.position.set(0, len, 0);
      pivot.add(next);
      parent = next;
    }
    // fingertip cap — small tip cap over the last segment
    var tip = new THREE.Mesh(new THREE.SphereGeometry(segRad[segRad.length-1]*0.85, 8, 6), skinMat);
    parent.add(tip);

    return { root: root, joints: joints };
  }

  var fingers = {
    // Thumb: attached directly at the palm's thumb-side edge (matching the
    // palm shape's radial-side vertices around x:-0.80,y:-0.55 to x:-0.66,y:0.70)
    // with a base knuckle block bridging the join so it doesn't float free
    // of the palm.
    thumb:  buildFinger([0.5, 0.4], [0.23,0.19,0.15], -0.78, -0.05, 0.14, null,
              { x: -0.35, y: 0, z: 0.85 }),
    index:  buildFinger([0.62, 0.42, 0.34],[0.16,0.135,0.11,0.09], -0.58, 0.98, 0.1, 0.08),
    middle: buildFinger([0.68, 0.46, 0.36],[0.17,0.14,0.11,0.09], -0.18, 1.05, 0.1, 0.02),
    ring:   buildFinger([0.62, 0.42, 0.33],[0.16,0.13,0.105,0.085], 0.22, 1.0, 0.1, -0.03),
    pinky:  buildFinger([0.5, 0.34, 0.28], [0.135,0.11,0.09,0.075], 0.6, 0.84, 0.08, -0.1)
  };

  // Thumb base knuckle — a stub block that visually connects the thumb
  // root to the palm shell so there's no visible gap/hover between them.
  var thumbBase = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.26, 0.3, 10), skinMat);
  thumbBase.position.set(-0.78, -0.05, 0.08);
  thumbBase.rotation.z = 1.1;
  thumbBase.rotation.x = -0.2;
  thumbBase.castShadow = true;
  handGroup.add(thumbBase);

  // Index/pinky knuckle bridges — small stub blocks connecting those two
  // finger bases to the palm shell, same idea as the thumb base, so the
  // joint doesn't appear to hover off the palm edge.
  var indexBase = new THREE.Mesh(new THREE.CylinderGeometry(0.155, 0.17, 0.22, 10), skinMat);
  indexBase.position.set(-0.58, 0.9, 0.08);
  indexBase.rotation.x = -0.25;
  indexBase.castShadow = true;
  handGroup.add(indexBase);

  var pinkyBase = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.145, 0.2, 10), skinMat);
  pinkyBase.position.set(0.6, 0.76, 0.06);
  pinkyBase.rotation.x = -0.25;
  pinkyBase.castShadow = true;
  handGroup.add(pinkyBase);

  handGroup.rotation.x = 0;
  handGroup.position.y = 0;

  // ---------- Slider wiring ----------
  var MAX_CURL = { thumb: 1.0, index: 1.5, middle: 1.5, ring: 1.5, pinky: 1.5 };

  function curlFinger(name, t){ // t in [0,1]
    var f = fingers[name];
    var max = MAX_CURL[name];
    f.joints.forEach(function(pivot, i){
      var per = max * (i === 0 ? 0.85 : 1.0); // base joint bends slightly less
      pivot.rotation.x = per * t;
    });
    if (name === 'thumb'){
      // thumb curls across the palm (adduction) in addition to bending,
      // which is what makes a real thumb-curl look correct rather than
      // just folding forward like a finger
      f.root.rotation.z = 0.95 + 0.5 * t;
    }
  }

  // Wrist rotation: spins handGroup (and the attached collar) around the
  // forearm axis (Y), while the cuff mesh (on wristGroup) stays fixed —
  // like a real wrist turning inside a static socket housing. 90° is the
  // neutral pose; the slider goes from 0 to 180 either side of that.
  var wristSlider = document.getElementById('wrist-slider');
  var wristOut = document.getElementById('out-wrist');
  function setWristRotation(deg){
    handGroup.rotation.y = (deg - 90) * Math.PI / 180;
  }
  wristSlider.addEventListener('input', function(){
    var v = parseFloat(wristSlider.value);
    wristOut.textContent = Math.round(motorOf('wrist-slider',v)) + '°';
    setWristRotation(v);
    scene.updateMatrixWorld(true); // ensure the new wrist rotation is reflected before the camera reads palm orientation
    fingerViewStale = true; // wrist rotation reorients the hand, so any later finger-view use must recompute
    focusWrist(); // re-asserts the SAME cached camera target — does not recompute, so the shot holds still while the wrist turns
  });
  setWristRotation(90);

  // Shoulder rotation 1: spins the ENTIRE arm assembly (shoulder block +
  // bicep + elbow + forearm + wrist + hand, all together, since they all
  // hang from shoulderAnchor which is a child of shoulderPivot) about the
  // same vertical axis, with the exact same 0–180°/90°-neutral convention
  // as the wrist slider — it's the same kind of rotation, just applied one
  // level higher up the chain so it carries everything below it along.
  var shoulderSlider = document.getElementById('shoulder-slider');
  var shoulderOut = document.getElementById('out-shoulder');
  shoulderSlider.addEventListener('input', function(){
    var v = parseFloat(shoulderSlider.value);
    shoulderOut.textContent = Math.round(motorOf('shoulder-slider',v)) + '°';
    setShoulderRotation(v);
    scene.updateMatrixWorld(true);
    fingerViewStale = true; // shoulder rotation relocates the hand in world space
    wristViewStale = true; // ...and invalidates the cached wrist shot too, so it re-frames on the palm's new position next time
    focusShoulder(); // frame the shoulder joint + whole arm rotating below it
  });
  setShoulderRotation(90);

  // Rotation 2 (abduction/lift): raises the whole arm out to the side from
  // the shoulder, jumping-jack style. Framed from a side-on camera angle
  // so the lift motion is clearly visible as it happens.
  var abductionSlider = document.getElementById('abduction-slider');
  var abductionOut = document.getElementById('out-abduction');
  abductionSlider.addEventListener('input', function(){
    var v = parseFloat(abductionSlider.value);
    abductionOut.textContent = Math.round(motorOf('abduction-slider',v)) + '°';
    setAbductionRotation(v);
    scene.updateMatrixWorld(true);
    fingerViewStale = true; // abduction lift relocates the hand in world space
    wristViewStale = true;
    focusAbduction();
  });
  setAbductionRotation(0);

  // Extend joint: slides the arm forward out of the small side-cylinder/
  // cube joint. Reuses the shoulder camera framing since it's the same
  // general area of the rig.
  var extendSlider = document.getElementById('extend-slider');
  var extendOut = document.getElementById('out-extend');
  extendSlider.addEventListener('input', function(){
    var v = parseFloat(extendSlider.value);
    extendOut.textContent = Math.round(motorOf('extend-slider',v)) + '°';
    setExtendJoint(v);
    scene.updateMatrixWorld(true);
    fingerViewStale = true; // extend joint relocates the hand in world space
    wristViewStale = true;
    focusShoulder();
  });
  setExtendJoint(0);

  updateGyroCube(); // position the stable cube correctly before the first render
  focusFingers(); // establish an initial well-framed view of the whole hand
  lastArmFocusFn = focusArm; // so the Arm shot zoom slider does something the very first time it's touched, even before any shoulder/elbow/wrist slider has been moved yet

  document.getElementById('autofocus-toggle').addEventListener('click', function(){
    setAutoFocusEnabled(!autoFocusEnabled);
  });

  var sliderIds = ['thumb','index','middle','ring','pinky'];
  sliderIds.forEach(function(id){
    var input = document.getElementById(id);
    var out = document.getElementById('out-'+id);
    input.addEventListener('input', function(){
      var max = parseFloat(input.max);
      var val = parseFloat(input.value);
      out.textContent = Math.round(motorOf(id,val)) + '°';
      curlFinger(id, val/max);
      // Force recompute every time (not just on the initial cached shot):
      // fingers curling or splaying changes the hand's actual bounding
      // box, so re-fitting to it each move keeps every finger correctly
      // in frame instead of reusing a box sized for whatever pose was
      // open the first time.
      focusFingers(true);
    });
  });

  // Arm / elbow joint slider — bends the lower forearm at the elbow pivot
  // and shifts camera focus down to that joint while it's being dragged.
  var armSlider = document.getElementById('arm-slider');
  var armOut = document.getElementById('out-arm');
  armSlider.addEventListener('input', function(){
    var v = parseFloat(armSlider.value);
    armOut.textContent = Math.round(motorOf('arm-slider',v)) + '°';
    // Positive, unmirrored: worked through the actual rotation math (see
    // notes near armAssembly.scale.x = -1) — a mirror across X does NOT
    // flip the visual direction of an X-axis rotation when the limb starts
    // out pointing along -Y, unlike Z-axis (abduction), which does. This
    // also matches real elbow anatomy: positive rotation.x swings the
    // forearm toward -Z (the front/camera side), i.e. flexion, not
    // hyperextension.
    forearmPivot.rotation.x = v * Math.PI / 180;
    fingerViewStale = true; // elbow flex relocates the hand in world space
    wristViewStale = true;
    focusArm();
  });

  function setPose(vals, animate){
    sliderIds.forEach(function(id){
      var input = document.getElementById(id);
      var out = document.getElementById('out-'+id);
      var v = vals[id];
      input.value = v;
      out.textContent = Math.round(motorOf(id,v)) + '°';
      curlFinger(id, v/parseFloat(input.max));
    });
  }

  document.getElementById('preset-open').addEventListener('click', function(){
    setPose({ thumb:0, index:0, middle:0, ring:0, pinky:0 });
  });
  document.getElementById('preset-fist').addEventListener('click', function(){
    setPose({ thumb:70, index:100, middle:100, ring:100, pinky:100 });
  });
  document.getElementById('preset-point').addEventListener('click', function(){
    setPose({ thumb:60, index:0, middle:100, ring:100, pinky:100 });
  });
  document.getElementById('preset-peace').addEventListener('click', function(){
    setPose({ thumb:70, index:0, middle:0, ring:100, pinky:100 });
  });
  document.getElementById('preset-thumbsup').addEventListener('click', function(){
    setPose({ thumb:0, index:100, middle:100, ring:100, pinky:100 });
  });

  // ---------- Render loop ----------
  // NOTE: this used to gate updateCam() entirely behind `autoFocusActive`.
  // Any manual drag/scroll on the viewport sets autoFocusActive=false (by
  // design, so a manual look-around isn't fought by auto-focus), but that
  // flag was never guaranteed to flip back on before the NEXT playback/
  // preview tween started — so if you'd ever dragged the viewport even
  // once, hitting Play could leave the camera frozen in place while the
  // hand moved (the "camera not following" problem). Fix: whenever a
  // tween/playback is actively in flight (playbackActive), force the
  // camera update to run regardless of any earlier manual-drag flag.
  var playbackActive = false;
  function animate(){
    requestAnimationFrame(animate);
    updateGyroCube(); // keep the stable cube tracking the joint's position every frame, regardless of which slider moved
    if (playbackActive || (autoFocusEnabled && autoFocusActive)){
      focusY += (targetFocusY - focusY) * 0.08;
      focusDistOffset += (targetFocusDistOffset - focusDistOffset) * 0.08;
      updateCam();
    }
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', function(){
    camera.aspect = host.clientWidth/host.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(host.clientWidth, host.clientHeight);
  });

  window.__handRigReady = true;
  setStatus('Ready', false);
  cacheInfo.textContent = 'No external model in use — this hand is generated in code, so there is nothing to cache. Swap in loadHandModel(url) with a real .glb to enable device caching.';

  // ---------- Public API for the gesture recorder / creator UI ----------
  // Exposes just enough surface area for outside code (the recorder script
  // below) to read/set joint values, grab a well-framed screenshot, and
  // know which joints most recently moved — without reaching into any of
  // the internal three.js rig variables directly.
  var jointIds = ['thumb','index','middle','ring','pinky','wrist-slider','arm-slider','shoulder-slider','abduction-slider','extend-slider'];
  var lastMovedGroup = null; // 'fingers' | 'arm' | 'both' | null — set by slider handlers below via a light wrapper

  function currentPose(){
    var pose = {};
    jointIds.forEach(function(id){
      pose[id] = parseFloat(document.getElementById(id).value);
    });
    return pose;
  }

  function applyPose(pose, opts){
    opts = opts || {};
    sliderIds.forEach(function(id){
      if (pose[id] === undefined) return;
      var input = document.getElementById(id);
      var out = document.getElementById('out-'+id);
      input.value = pose[id];
      out.textContent = Math.round(motorOf(id,pose[id])) + '°';
      curlFinger(id, pose[id]/parseFloat(input.max));
    });
    if (pose['wrist-slider'] !== undefined){
      wristSlider.value = pose['wrist-slider'];
      wristOut.textContent = Math.round(motorOf('wrist-slider',pose['wrist-slider'])) + '°';
      setWristRotation(pose['wrist-slider']);
    }
    if (pose['arm-slider'] !== undefined){
      armSlider.value = pose['arm-slider'];
      armOut.textContent = Math.round(motorOf('arm-slider',pose['arm-slider'])) + '°';
      forearmPivot.rotation.x = pose['arm-slider'] * Math.PI / 180;
    }
    if (pose['shoulder-slider'] !== undefined){
      shoulderSlider.value = pose['shoulder-slider'];
      shoulderOut.textContent = Math.round(motorOf('shoulder-slider',pose['shoulder-slider'])) + '°';
      setShoulderRotation(pose['shoulder-slider']);
    }
    if (pose['abduction-slider'] !== undefined){
      abductionSlider.value = pose['abduction-slider'];
      abductionOut.textContent = Math.round(motorOf('abduction-slider',pose['abduction-slider'])) + '°';
      setAbductionRotation(pose['abduction-slider']);
    }
    if (pose['extend-slider'] !== undefined){
      extendSlider.value = pose['extend-slider'];
      extendOut.textContent = Math.round(motorOf('extend-slider',pose['extend-slider'])) + '°';
      setExtendJoint(pose['extend-slider']);
    }
    scene.updateMatrixWorld(true);
    fingerViewStale = true;
    if (!opts.silent){
      // Choose the most sensible camera framing for a fully-applied pose —
      // fingers view covers the common case (hand-only gestures); playback
      // code in the recorder can override with a specific joint focus.
      focusFingers(true);
    }
  }

  function defaultPose(){
    var p = {};
    jointIds.forEach(function(id){
      var input = document.getElementById(id);
      p[id] = ({'wrist-slider':90,'shoulder-slider':98,'arm-slider':68,'abduction-slider':26})[id] || 0;
    });
    return p;
  }

  // Start the 3D arm AT the real zero positions (forearm 68, rotation 1 98, lift 26); the sliders then read 0.
  applyPose(defaultPose());   // also re-frames the camera on the arm's real start position (keeps the hand in view)

  // Which joints differ from the neutral/rest pose, split into the two
  // camera-relevant groups the spec cares about: fingers vs arm(+shoulder/
  // wrist/elbow). Used by the recorder to decide what the capture should
  // frame and what to label the saved step.
  // Which joints differ from the neutral/rest pose, split into finer
  // camera-relevant groups (fingers, wrist, elbow, shoulder) instead of one
  // lumped "arm" bucket — so a save where e.g. only the wrist AND shoulder
  // moved (but not the elbow/fingers) is correctly recognised as "multiple
  // parts moved" and gets the full-coverage hero shot, not just the narrow
  // elbow-focused view.
  function movedGroups(pose, baseline){
    baseline = baseline || defaultPose();
    function moved(ids){ return ids.some(function(id){ return Math.round(pose[id]) !== Math.round(baseline[id]); }); }
    var fingersMoved = moved(['thumb','index','middle','ring','pinky']);
    var wristMoved = moved(['wrist-slider']);
    var elbowMoved = moved(['arm-slider']);
    var shoulderMoved = moved(['shoulder-slider','abduction-slider','extend-slider']);
    var armMoved = wristMoved || elbowMoved || shoulderMoved; // kept for backward-compatible callers
    var movedCount = [fingersMoved, wristMoved, elbowMoved, shoulderMoved].filter(Boolean).length;
    return {
      fingers: fingersMoved, arm: armMoved,
      wrist: wristMoved, elbow: elbowMoved, shoulder: shoulderMoved,
      multi: movedCount > 1 // true whenever more than one distinct part moved — drives the "cover everything" framing
    };
  }

  // Frame the camera for a given pose's moved-group combination and settle
  // before resolving, so a screenshot taken right after resolves clean.
  // ---------- Fixed vs Moving camera mode ----------
  // Moving (default): frameForGroups/tweenTo pick a close, joint-specific
  // angle (hand close-up, elbow close-up, or a mid-distance combined shot).
  // Fixed: every photo and every frame of a multi-joint motion instead uses
  // ONE distant, unmoving wide shot that always keeps the entire hand+arm
  // rig in frame, regardless of which joints moved — useful for gestures
  // that involve several joints at once, since nothing ever gets clipped
  // and the whole assembly reads as one static, comparable angle.
  var cameraMode = 'moving'; // 'moving' | 'fixed'
  function setCameraMode(mode){
    var next = (mode === 'fixed') ? 'fixed' : 'moving';
    if (next === 'fixed' && cameraMode !== 'fixed'){
      // Fresh switch into fixed mode: re-baseline the one wide shot from
      // scratch. It then stays locked (see fixedViewStale) through every
      // subsequent photo and every frame of playback until toggled off
      // and on again.
      fixedViewStale = true;
    }
    cameraMode = next;
  }

  var FIXED_VIEW_POS = null;
  var FIXED_VIEW_LOOKAT = null;
  // Only true right when fixed mode is freshly switched on. As long as
  // it stays false, frameFixedWide() reuses the SAME cached position for
  // every photo and every tween step — a genuinely unmoving shot for the
  // whole motion, matching what the toggle's hint text promises. Before,
  // computeFixedView() ran fresh on every single tween step, so the shot
  // actually drifted/re-zoomed step to step as the pose (and therefore
  // the live bounding box) changed — that's the "it isn't fixed" bug.
  var fixedViewStale = true;
  function computeFixedView(sweepBox){
    scene.updateMatrixWorld(true);
    // Bounding box of the ENTIRE rig (arm assembly + hand), not just the
    // hand, so the fixed shot always covers every joint no matter how far
    // the shoulder/elbow/wrist have moved the hand from rest. When a
    // sweepBox is supplied (start pose ∪ end pose of the tween that's
    // about to play), use that instead so the very first fixed-mode shot
    // — computed fresh right as playback begins — already covers the full
    // arc of THIS motion rather than only wherever the rig happens to be
    // sitting the instant it's (re)computed.
    var fullBox = sweepBox || new THREE.Box3().setFromObject(armAssembly);
    var center = new THREE.Vector3();
    var size = new THREE.Vector3();
    fullBox.getCenter(center);
    fullBox.getSize(size);
    var radius = size.length() * 0.5;
    var vFov = camera.fov * Math.PI / 180;
    var aspect = camera.aspect || (host.clientWidth / host.clientHeight);
    var hFov = 2 * Math.atan(Math.tan(vFov/2) * aspect);
    var limitingFov = Math.min(vFov, hFov);
    // Slightly less fill than the close-up views (0.62 vs 0.8) and a floor
    // pulled back further, since this angle is deliberately distant so nothing
    // is ever clipped as joints move through their full range.
    var dist = Math.max((radius / 0.62) / Math.sin(limitingFov/2), 6);
    var dir = new THREE.Vector3(0.55, 0.32, -1).normalize();
    FIXED_VIEW_POS = center.clone().addScaledVector(dir, dist);
    FIXED_VIEW_LOOKAT = center.clone();
  }
  function frameFixedWide(instant, sweepBox){
    isDragging = false;
    autoFocusMode = 'hand';
    lastArmFocusFn = function(){ frameFixedWide(true); };
    if (fixedViewStale || !FIXED_VIEW_POS){
      computeFixedView(sweepBox);
      fixedViewStale = false;
    }
    handTargetPos.copy(FIXED_VIEW_POS);
    handTargetLookAt.copy(FIXED_VIEW_LOOKAT);
    autoFocusActive = true; // explicit programmatic framing call — always take effect, even if the ambient auto-focus toggle is off or a prior drag suspended it
    if (instant){
      camPos.copy(handTargetPos);
      camLookAt.copy(handTargetLookAt);
      camera.position.copy(camPos);
      camera.lookAt(camLookAt);
    }
  }

  // ---------- "Hero shot": ad-style framing that covers every part that moved ----------
  // Used whenever a save/step touched more than one distinct part (e.g.
  // fingers + elbow, or wrist + shoulder) so nothing gets clipped and the
  // whole gesture reads as one deliberate, well-composed angle — a slightly
  // elevated three-quarter view around the full rig's current bounding
  // box, similar in spirit to a product-shot camera angle rather than a
  // plain straight-on framing. Respects the arm-zoom slider.
  // sweepBox (optional): when provided, the framing is computed from THIS
  // box instead of re-reading the live rig's current bounding box. Callers
  // driving a tween pass in the UNION of the start-pose and end-pose boxes
  // (see computeSweepBox below) so the shot covers the whole arc the joints
  // travel through, not just wherever the rig happens to be sitting the
  // instant the frame call fires. Without this, a tween that starts far
  // from the destination pose would frame tightly around only the
  // destination, and the hand would visibly swing out of frame mid-motion
  // before ever arriving — the "hand goes off camera during play" bug.
  var heroBox = new THREE.Box3();
  function frameHeroShot(sweepBox){
    isDragging = false;
    autoFocusMode = 'hand';
    lastArmFocusFn = function(){ frameHeroShot(sweepBox); };
    var box;
    if (sweepBox){
      box = sweepBox;
    } else {
      scene.updateMatrixWorld(true);
      heroBox.setFromObject(armAssembly);
      box = heroBox;
    }
    var center = new THREE.Vector3();
    var size = new THREE.Vector3();
    box.getCenter(center);
    box.getSize(size);
    var radius = size.length() * 0.5;
    var vFov = camera.fov * Math.PI / 180;
    var aspect = camera.aspect || (host.clientWidth / host.clientHeight);
    var hFov = 2 * Math.atan(Math.tan(vFov/2) * aspect);
    var limitingFov = Math.min(vFov, hFov);
    // A bit more headroom (0.68 fill) than the fixed full-arm shot, and a
    // three-quarter elevated direction (rather than the fixed view's more
    // side-on angle) for a more deliberate, "presented" look.
    var dist = Math.max((radius / 0.68) / Math.sin(limitingFov/2), 5) * getArmZoomScale();
    var dir = new THREE.Vector3(0.68, 0.42, -0.85).normalize();
    handTargetPos.copy(center).addScaledVector(dir, dist);
    handTargetLookAt.copy(center);
    handTargetUp.set(0, 1, 0);
    autoFocusActive = true; // explicit capture framing — always takes effect
  }

  // ---------- Localized "near-joint pair" framing ----------
  // When exactly two ADJACENT joints moved together (wrist+fingers,
  // elbow+wrist, or shoulder+elbow), frame tightly around just that
  // sub-chain instead of the whole arm — e.g. wrist+fingers frames the
  // hand+wrist only, not the shoulder all the way down. Non-adjacent pairs
  // (e.g. wrist+shoulder, with the elbow in between) or 3+ moved parts
  // still use the full-coverage hero shot (frameHeroShot) since the span
  // between them necessarily covers the whole arm anyway.
  var CHAIN_ORDER = ['shoulder','elbow','wrist','fingers'];
  // Which live rig object's bounding box to use for each adjacent pair —
  // chosen as the nearest common ancestor that contains exactly that
  // sub-chain (and everything rigidly attached below it, which is
  // unavoidable/expected since those parts physically hang together).
  var PAIR_ANCHOR = {
    'shoulder,elbow': function(){ return shoulderAnchor; }, // bicep+elbow+forearm+wrist+hand
    'elbow,wrist':    function(){ return elbowPivot; },     // elbow ball+forearm+wrist+hand (excludes bicep/shoulder)
    'wrist,fingers':  function(){ return wristGroup; }       // cuff+hand+fingers (excludes forearm/elbow/shoulder)
  };
  function adjacentPairAnchor(groups){
    var moved = CHAIN_ORDER.filter(function(k){ return groups[k]; });
    if (moved.length !== 2) return null;
    var i0 = CHAIN_ORDER.indexOf(moved[0]), i1 = CHAIN_ORDER.indexOf(moved[1]);
    if (Math.abs(i0 - i1) !== 1) return null; // not adjacent — fall back to full hero shot
    var key = moved[0] + ',' + moved[1];
    var fn = PAIR_ANCHOR[key];
    return fn ? fn() : null;
  }

  // sweepBox: same idea as frameHeroShot's — when provided (a union of the
  // start- and end-pose local boxes for this same anchor), frame from that
  // instead of re-measuring the anchor's live current box, so a tween's
  // localized pair shot also covers the whole arc it swings through.
  var pairBox = new THREE.Box3();
  function framePairShot(anchorObj, sweepBox){
    isDragging = false;
    autoFocusMode = 'hand';
    lastArmFocusFn = function(){ framePairShot(anchorObj, sweepBox); };
    var box;
    if (sweepBox){
      box = sweepBox;
    } else {
      scene.updateMatrixWorld(true);
      pairBox.setFromObject(anchorObj);
      box = pairBox;
    }
    var center = new THREE.Vector3();
    var size = new THREE.Vector3();
    box.getCenter(center);
    box.getSize(size);
    var radius = size.length() * 0.5;
    var vFov = camera.fov * Math.PI / 180;
    var aspect = camera.aspect || (host.clientWidth / host.clientHeight);
    var hFov = 2 * Math.atan(Math.tan(vFov/2) * aspect);
    var limitingFov = Math.min(vFov, hFov);
    // Same three-quarter elevated composition as the hero shot, just
    // scoped to the smaller local box so it fills the frame tighter.
    var dist = Math.max((radius / 0.7) / Math.sin(limitingFov/2), 3) * getArmZoomScale();
    var dir = new THREE.Vector3(0.68, 0.42, -0.85).normalize();
    handTargetPos.copy(center).addScaledVector(dir, dist);
    handTargetLookAt.copy(center);
    handTargetUp.set(0, 1, 0);
    autoFocusActive = true;
  }

  // Picks between the localized pair shot and the full hero shot for any
  // "multiple parts moved" pose, without changing any other framing path.
  // sweepBox/pairSweepBox: optional precomputed union boxes (start pose ∪
  // end pose) — see computeSweepBoxes() below — so a tween's framing covers
  // the whole arc the joints travel through, not just the endpoint.
  function frameMultiJoint(groups, sweepBox, pairSweepBox){
    var anchor = adjacentPairAnchor(groups);
    if (anchor){
      framePairShot(anchor, pairSweepBox);
    } else {
      frameHeroShot(sweepBox);
    }
  }

  // ---------- Sweep box: union of a pose's bounding box at TWO points in time ----------
  // A tween's destination-only framing can leave the hand travelling
  // outside the frame mid-motion whenever the start pose sits somewhere
  // meaningfully different from the end pose (e.g. a big shoulder swing, or
  // playback jumping between two non-adjacent saved steps after reordering/
  // deleting steps). Rather than trying to guess the swept volume
  // analytically, this applies BOTH poses to the live rig in turn, measures
  // the bounding box each time, and unions them — a box that's guaranteed
  // to contain both endpoints. Since motion between two poses in this rig
  // is always a smooth, monotonic interpolation of joint angles (no
  // overshoot), the union of the two endpoint boxes also contains every
  // intermediate frame for the parts that matter here (the hand/arm
  // silhouette moves through a bounded arc between its start and end
  // position — it doesn't loop back out past either endpoint).
  // Restores whatever pose was live before returning, so calling this
  // doesn't disturb the rig's on-screen state.
  var sweepBoxA = new THREE.Box3();
  var sweepBoxB = new THREE.Box3();
  var sweepUnion = new THREE.Box3();
  var pairSweepA = new THREE.Box3();
  var pairSweepB = new THREE.Box3();
  var pairSweepUnion = new THREE.Box3();
  function computeSweepBoxes(fromPose, toPose, pairAnchorObj){
    var restorePose = currentPose();
    applyPose(fromPose, { silent: true });
    scene.updateMatrixWorld(true);
    sweepBoxA.setFromObject(armAssembly);
    if (pairAnchorObj) pairSweepA.setFromObject(pairAnchorObj);
    applyPose(toPose, { silent: true });
    scene.updateMatrixWorld(true);
    sweepBoxB.setFromObject(armAssembly);
    if (pairAnchorObj) pairSweepB.setFromObject(pairAnchorObj);
    sweepUnion.copy(sweepBoxA).union(sweepBoxB);
    var pairResult = null;
    if (pairAnchorObj){
      pairSweepUnion.copy(pairSweepA).union(pairSweepB);
      pairResult = pairSweepUnion;
    }
    applyPose(restorePose, { silent: true });
    scene.updateMatrixWorld(true);
    return { hero: sweepUnion, pair: pairResult };
  }

  function frameForGroups(groups){
    return new Promise(function(resolve){
      if (cameraMode === 'fixed'){
        frameFixedWide(true);
        renderer.render(scene, camera);
        requestAnimationFrame(function(){ resolve(); });
        return;
      }
      if (groups.multi){
        // More than one part moved (fingers+arm, wrist+shoulder, etc.) —
        // use a tight shot around just the two parts if they're adjacent,
        // otherwise the full-coverage hero shot so nothing gets clipped.
        // Still-capture case: start and end pose are the same (current
        // live pose), so no sweep union is needed here.
        frameMultiJoint(groups);
      } else if (groups.arm){
        focusArm();
      } else {
        focusFingers(true);
      }
      // Snap camera instantly for capture purposes instead of waiting on the
      // slow lerp — copy target straight to live position/lookAt.
      camPos.copy(handTargetPos);
      camLookAt.copy(handTargetLookAt);
      camera.position.copy(camPos);
      camera.lookAt(camLookAt);
      renderer.render(scene, camera);
      requestAnimationFrame(function(){ resolve(); });
    });
  }

  // High-quality still capture: temporarily renders at a higher pixel
  // ratio (supersampled) than the live viewport uses, so saved gesture
  // photos are crisp even though the on-screen canvas runs at a lower
  // ratio for performance. Restores the normal ratio immediately after.
  function captureImage(opts){
    opts = opts || {};
    var hq = opts.highQuality !== false; // default true for saved-step/photo captures
    if (!hq){
      renderer.render(scene, camera);
      return renderer.domElement.toDataURL('image/png');
    }
    var prevRatio = renderer.getPixelRatio();
    var targetRatio = Math.max(prevRatio, Math.min(window.devicePixelRatio || 1, 2) * 2, 3);
    renderer.setPixelRatio(targetRatio);
    renderer.setSize(host.clientWidth, host.clientHeight, false);
    camera.aspect = host.clientWidth / host.clientHeight;
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    var dataUrl = renderer.domElement.toDataURL('image/png', 1.0);
    renderer.setPixelRatio(prevRatio);
    renderer.setSize(host.clientWidth, host.clientHeight, false);
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    return dataUrl;
  }

  // ---------- Smooth interpolated motion between two poses ----------
  // Eases every joint value from `fromPose` to `toPose` over durationMs,
  // applying intermediate poses every frame (so a real device driven off
  // the same pose stream would also move smoothly, not jump), and glides
  // the camera toward the best-fit framing for toPose's moved groups at
  // the same time. Resolves once the motion completes.
  function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

  var activeTween = null;
  function tweenTo(fromPose, toPose, durationMs, groups, onFrame){
    return new Promise(function(resolve){
      if (activeTween) activeTween.cancelled = true;
      var tweenState = { cancelled:false };
      activeTween = tweenState;
      // Force the camera to actively track this tween even if the user
      // previously dragged the viewport (which sets autoFocusActive=false)
      // or turned the ambient auto-focus feature off entirely — playback
      // is an explicit, programmatic camera move, not the ambient feature,
      // so it should never be silently skipped.
      playbackActive = true;
      autoFocusActive = true;

      // Recompute "what actually moves in THIS transition" fresh from the
      // real start/end poses, instead of trusting the caller-supplied
      // `groups`. A step's stored groups are frozen at save time relative
      // to whatever preceded it then — if the sequence was later
      // reordered, had a step deleted, or was duplicated/loaded from the
      // library, that stored value can silently go stale and no longer
      // describe the transition actually being played. Recomputing here
      // guarantees the camera always frames the transition it's really
      // showing, not a transition that no longer exists.
      //
      // IMPORTANT: this must be the CUMULATIVE diff from rest for BOTH
      // endpoints, unioned together — not just fromPose-vs-toPose. A
      // step's own delta only tells you what changes IN that step; it
      // says nothing about parts that were already moved by an earlier
      // step and are just being held (e.g. fingers already curled, then
      // a later step only turns the wrist). Framing off the delta alone
      // undersizes the shot to "wrist only" while the still-curled hand
      // sits outside that tight frame — the "hand goes off camera during
      // group playback" bug. Framing off the cumulative union fixes that:
      // the box/group classification always accounts for every joint
      // that is actually non-neutral at either end of this transition,
      // so a single incremental change still gets its tight close-up
      // (nothing else is non-neutral), while a change layered on top of
      // an already-posed hand correctly gets the wider multi/pair shot
      // that keeps everything in frame.
      var restPose = defaultPose();
      var fromCumulative = movedGroups(fromPose, restPose);
      var toCumulative = movedGroups(toPose, restPose);
      var liveGroups = {
        fingers: fromCumulative.fingers || toCumulative.fingers,
        wrist: fromCumulative.wrist || toCumulative.wrist,
        elbow: fromCumulative.elbow || toCumulative.elbow,
        shoulder: fromCumulative.shoulder || toCumulative.shoulder
      };
      liveGroups.arm = liveGroups.wrist || liveGroups.elbow || liveGroups.shoulder;
      var liveMovedCount = [liveGroups.fingers, liveGroups.wrist, liveGroups.elbow, liveGroups.shoulder].filter(Boolean).length;
      liveGroups.multi = liveMovedCount > 1;

      // Pre-orient the camera toward framing that covers the FULL SWING of
      // this tween (not just the destination pose) so playback never lets
      // the hand travel outside the frame partway through. In fixed mode
      // the camera never moves at all — it stays parked on the one distant
      // wide shot for the whole motion.
      if (cameraMode === 'fixed'){
        // Only bother measuring a sweep box when the fixed shot is about to
        // be (re)computed fresh — once cached it deliberately stays locked
        // for every subsequent step, per the "genuinely unmoving shot"
        // design, so there's no need to recompute the sweep on every tween.
        var fixedSweep = (fixedViewStale || !FIXED_VIEW_POS) ? computeSweepBoxes(fromPose, toPose, null).hero : null;
        frameFixedWide(false, fixedSweep);
      } else if (liveGroups.multi){
        // More than one part moved together — glide to the same framing
        // used for stills: a tight shot around just the two parts if
        // they're adjacent, otherwise the full-coverage hero shot. Compute
        // the sweep union (start pose ∪ end pose) so the shot covers
        // wherever the joints travel through, not just where they land.
        var pairAnchor = adjacentPairAnchor(liveGroups);
        var sweep = computeSweepBoxes(fromPose, toPose, pairAnchor);
        frameMultiJoint(liveGroups, sweep.hero, sweep.pair);
      } else if (liveGroups.arm){
        focusArm();
      } else {
        fingerViewStale = true;
        focusFingers(true);
      }

      var startTime = performance.now();
      function frame(now){
        if (tweenState.cancelled) return resolve();
        var t = Math.min(1, (now - startTime) / durationMs);
        var eased = easeInOutCubic(t);
        var mid = {};
        jointIds.forEach(function(id){
          var a = fromPose[id], b = toPose[id];
          mid[id] = a + (b - a) * eased;
        });
        applyPose(mid, { silent: true });
        if (onFrame) onFrame(eased);
        if (t < 1){
          requestAnimationFrame(frame);
        } else {
          if (activeTween === tweenState) activeTween = null;
          if (!activeTween) playbackActive = false; // last tween in the chain finished
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  window.HandRig = {
    currentPose: currentPose,
    applyPose: applyPose,
    defaultPose: defaultPose,
    movedGroups: movedGroups,
    frameForGroups: frameForGroups,
    captureImage: captureImage,
    canvasEl: renderer.domElement, // raw <canvas> — the preview modal draws live frames from this into its own canvas to replay the actual recorded pose values
    tweenTo: tweenTo,
    setCameraMode: setCameraMode,
    setArmZoomPercent: setArmZoomPercent,
    onSliderChange: null // recorder attaches a callback here; called after every slider 'input' event fires
  };

  // Light hook: every slider that already has an 'input' listener above
  // also notifies HandRig.onSliderChange, if the recorder script has set
  // one, so it can show the floating Save-position button under whatever
  // slider just moved.
  jointIds.forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){
      if (window.HandRig.onSliderChange) window.HandRig.onSliderChange(id);
    });
  });
})();
<\/script>

<script>
/* =========================================================================
   Gesture recorder / creator controller.
   Talks to the rig only through window.HandRig — never touches Three.js
   internals directly. Handles: save-position pills, the motion sequence
   list, per-step delay, play/pause transport, the final preview modal
   (image + looping motion preview with angle switching), and the Save
   Gesture / Save & Publish flow, which hands the finished gesture off to
   the Gesture Library page via localStorage (works with a plain static
   file setup, no backend required).
   ========================================================================= */
(function(){

  function whenRigReady(cb){
    if (window.__handRigReady && window.HandRig) return cb();
    setTimeout(function(){ whenRigReady(cb); }, 50);
  }

  var toastEl = document.getElementById('toast');
  var toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  // Warning toast: slides in from the left edge, used specifically for
  // "nothing changed / can't save a duplicate" cases, so it's visually
  // distinct from the normal bottom-center confirmation toast.
  var warnEl = document.getElementById('warn-toast');
  var warnTimer;
  function warn(msg){
    warnEl.textContent = msg;
    warnEl.classList.remove('show');
    // restart the transition even if a warning is already showing
    void warnEl.offsetWidth;
    warnEl.classList.add('show');
    clearTimeout(warnTimer);
    warnTimer = setTimeout(function(){ warnEl.classList.remove('show'); }, 2800);
  }

  // Compares two poses (rounded to whole degrees, same rounding the rig
  // itself uses for movedGroups) to decide whether anything actually
  // changed. Used to block saving an identical position twice in a row.
  function posesEqual(a, b){
    return Object.keys(a).every(function(id){
      return Math.round(a[id]) === Math.round(b[id]);
    });
  }

  whenRigReady(function(){
    var Rig = window.HandRig;

    /* ---------------- Save-position pills ---------------- */
    // Every slider gets its own pill directly beneath it. Moving a slider
    // reveals ONLY that slider's pill (others collapse), matching "pops
    // smoothly under each slider when I change the values".
    var pills = Array.prototype.slice.call(document.querySelectorAll('.save-pos-pill'));
    function showPillFor(id){
      pills.forEach(function(p){
        p.classList.toggle('show', p.getAttribute('data-for') === id);
      });
    }
    Rig.onSliderChange = function(id){ showPillFor(id); };

    pills.forEach(function(pill){
      pill.querySelector('.save-pos-btn').addEventListener('click', function(){
        saveCurrentAsStep();
        pill.classList.remove('show');
      });
    });

    /* ---------------- Motion sequence state ---------------- */
    // Each step: { id, name, pose, groups:{fingers,arm}, image, delay (ms), isGroup }
    var sequence = [];
    var baselinePose = Rig.defaultPose();
    var stepCounter = 0;

    var seqListEl = document.getElementById('sequence-list');
    var seqEmptyEl = document.getElementById('sequence-empty');
    var seqCountEl = document.getElementById('sequence-count');
    var previewSeqListEl = document.getElementById('preview-sequence-list');

    function groupLabelFor(step){
      return step.groups.fingers && step.groups.arm ? 'Fingers + arm'
           : step.groups.fingers ? 'Fingers'
           : step.groups.arm ? 'Arm / shoulder'
           : 'No change';
    }

    // Shared renderer for both the editor list and the preview-modal list —
    // `dragEnabled` controls whether drag-to-reorder handles are wired.
    function renderStepList(container, emptyEl){
      if (emptyEl) container.querySelectorAll('.seq-step').forEach(function(n){ n.remove(); });
      else container.innerHTML = '';
      if (emptyEl) emptyEl.style.display = sequence.length ? 'none' : 'block';

      sequence.forEach(function(step, i){
        var row = document.createElement('div');
        row.className = 'seq-step' + (step.isGroup ? ' group' : '');
        row.setAttribute('draggable', 'true');
        row.dataset.stepId = step.id;

        row.innerHTML =
          '<span class="seq-drag" title="Drag to reorder">⠿</span>' +
          '<div class="seq-thumb"><img src="'+step.image+'" alt="'+step.name+'"></div>' +
          '<div class="seq-body">' +
            '<input class="seq-name-input" value="'+step.name+'">' +
            '<div class="seq-meta">'+groupLabelFor(step)+(step.isGroup?' <span class="seq-title-badge">Group</span>':'')+'</div>' +
          '</div>' +
          '<div class="seq-delay"><input type="number" min="0" step="50" value="'+step.delay+'"><span>ms</span></div>' +
          '<button class="seq-remove" title="Remove step">✕</button>';

        row.querySelector('.seq-name-input').addEventListener('input', function(e){
          step.name = e.target.value || step.name;
          syncOtherList(container);
        });
        row.querySelector('.seq-delay input').addEventListener('input', function(e){
          step.delay = Math.max(0, parseInt(e.target.value, 10) || 0);
          syncOtherList(container);
        });
        row.querySelector('.seq-remove').addEventListener('click', function(){
          sequence = sequence.filter(function(s){ return s.id !== step.id; });
          renderSequence();
        });

        // Drag-to-reorder
        row.addEventListener('dragstart', function(){
          row.classList.add('dragging');
        });
        row.addEventListener('dragend', function(){
          row.classList.remove('dragging');
          renderSequence();
        });
        row.addEventListener('dragover', function(e){
          e.preventDefault();
          var dragging = container.querySelector('.seq-step.dragging');
          if (!dragging || dragging === row) return;
          var rect = row.getBoundingClientRect();
          var before = (e.clientY - rect.top) < rect.height / 2;
          container.insertBefore(dragging, before ? row : row.nextSibling);
        });
        row.addEventListener('drop', function(){
          // Recompute `sequence` order from the current DOM order of ids.
          var ids = Array.prototype.slice.call(container.querySelectorAll('.seq-step')).map(function(n){ return n.dataset.stepId; });
          sequence.sort(function(a,b){ return ids.indexOf(a.id) - ids.indexOf(b.id); });
        });

        container.appendChild(row);
      });
    }

    function syncOtherList(fromContainer){
      // Keep the editor list and preview-modal list showing the same data
      // (names/delays) even though they're separate DOM trees.
      if (fromContainer === seqListEl) renderStepList(previewSeqListEl, null);
      else renderStepList(seqListEl, seqEmptyEl);
    }

    function renderSequence(){
      renderStepList(seqListEl, seqEmptyEl);
      renderStepList(previewSeqListEl, null);
      seqCountEl.textContent = sequence.length + (sequence.length === 1 ? ' step' : ' steps');
    }

    function makeStep(pose, groups, image, isGroup){
      stepCounter++;
      return {
        id: 's' + Date.now() + '_' + stepCounter,
        name: (isGroup ? 'Group move ' : 'Step ') + stepCounter,
        pose: pose, groups: groups, image: image, delay: 900, isGroup: !!isGroup
      };
    }

    var savingStep = false; // guards against a fast double-tap on "Save position"
    // firing two saves for the same async capture before the first
    // resolves, which is what caused the same points to be saved twice.
    function saveCurrentAsStep(){
      if (savingStep) return;
      var pose = Rig.currentPose();
      if (posesEqual(pose, baselinePose)){
        warn('Unable to save — nothing has changed since the last step. If you want to increase the timing, raise that step\u2019s delay instead.');
        return;
      }
      savingStep = true;
      var groups = Rig.movedGroups(pose, baselinePose);
      Rig.frameForGroups(groups).then(function(){
        var image = Rig.captureImage({ highQuality: true });
        sequence.push(makeStep(pose, groups, image, false));
        baselinePose = pose; // next step's "what moved" is relative to this one
        renderSequence();
        toast('Position saved as "' + sequence[sequence.length-1].name + '"');
      }).finally(function(){
        savingStep = false;
      });
    }

    // Save Group: captures whatever the CURRENT full pose is (regardless of
    // how many sliders were touched since the last save) as a single step,
    // and — since several joints likely changed together — always frames
    // the best combined angle that covers everything that moved (fingers
    // view if only fingers changed, arm view if only arm changed, wide
    // combined view if both changed), same detection as individual saves,
    // just explicitly invoked instead of firing per-slider.
    var savingGroup = false; // same double-tap guard as saveCurrentAsStep
    function saveGroupAsStep(){
      if (savingGroup) return;
      var pose = Rig.currentPose();
      var groups = Rig.movedGroups(pose, baselinePose);
      if (!groups.fingers && !groups.arm || posesEqual(pose, baselinePose)){
        warn('Unable to save — nothing has changed since the last step. If you want to increase the timing, raise that step\u2019s delay instead.');
        return;
      }
      savingGroup = true;
      Rig.frameForGroups(groups).then(function(){
        var image = Rig.captureImage({ highQuality: true });
        sequence.push(makeStep(pose, groups, image, true));
        baselinePose = pose;
        renderSequence();
        toast('Group move saved as "' + sequence[sequence.length-1].name + '"');
      }).finally(function(){
        savingGroup = false;
      });
    }
    document.getElementById('save-group-btn').addEventListener('click', saveGroupAsStep);

    renderSequence();

    /* ---------------- Sequence transport (play/pause) ---------------- */
    // Smooth playback: tween from each step's pose to the next over that
    // step's delay, instead of snapping instantly — this is the same pose
    // stream a real device would be driven with, so the physical arm would
    // also move smoothly through the same interpolated positions.
    var playBtn = document.getElementById('play-sequence');
    var pauseBtn = document.getElementById('pause-sequence');
    var isPlaying = false;
    var playToken = 0;

    function runSmoothPlayback(onStep, token){
      if (!sequence.length){ return Promise.resolve(); }
      var current = Rig.currentPose();
      var i = 0;
      function next(){
        if (token !== playToken) return Promise.resolve();
        var step = sequence[i % sequence.length];
        var duration = Math.max(150, step.delay);
        return Rig.tweenTo(current, step.pose, duration, step.groups).then(function(){
          current = step.pose;
          if (onStep) onStep(step, i);
          i++;
          if (token !== playToken) return;
          return next();
        });
      }
      return next();
    }

    function startPlayback(){
      if (!sequence.length){ toast('Save at least one position first'); return; }
      isPlaying = true;
      playToken++;
      var token = playToken;
      playBtn.disabled = true;
      pauseBtn.disabled = false;
      runSmoothPlayback(null, token);
    }
    function stopPlayback(){
      isPlaying = false;
      playToken++; // invalidates any in-flight tween chain
      playBtn.disabled = false;
      pauseBtn.disabled = true;
    }
    playBtn.addEventListener('click', startPlayback);
    pauseBtn.addEventListener('click', stopPlayback);

    /* ---------------- Video mode ----------------
       The toggle that used to sit in the top bar is gone. Every saved
       gesture carries its full step-by-step pose sequence regardless, and
       the library page has its own Image / Video / Follow-camera selector,
       so asking the same question twice — once here at save time, once
       there at view time — only ever produced cards that refused to play
       because a checkbox in a closed editor had been left off. The flag is
       now simply always true. */
    var VIDEO_MODE = true;

    /* ---------------- Fixed vs Moving camera toggle ---------------- */
    // Fixed: one distant, unmoving wide shot used for every photo AND every
    // frame of a motion — always keeps the whole hand+arm rig in view no
    // matter how many joints are moving at once. Moving (default): the
    // usual per-joint close-up framing described elsewhere on this page.
    var cameraModeToggle = document.getElementById('camera-mode-toggle');
    var cameraModeLabel = document.getElementById('camera-mode-label');
    var cameraModeHint = document.getElementById('camera-mode-hint');
    var previewCameraModeToggle = document.getElementById('preview-camera-mode-toggle');
    var previewCameraModeHint = document.getElementById('preview-camera-mode-hint');

    function applyCameraMode(fixed){
      Rig.setCameraMode(fixed ? 'fixed' : 'moving');
      cameraModeToggle.checked = fixed;
      cameraModeLabel.textContent = fixed ? 'Fixed camera (follow off)' : 'Follow camera';
      cameraModeHint.textContent = fixed
        ? 'Follow camera is off: one distant, unmoving wide angle is used for every photo and every frame of the motion, always keeping the whole arm — shoulder to fingertips — in frame together, so you see the entire arm move without any cutting or panning.'
        : 'Follow camera: the shot tracks the palm and tightens on whatever joints just moved, for close-up detail shots. Switch off for one distant, unmoving wide angle that keeps the whole arm — shoulder to fingertips — in frame for every photo and every frame of the motion, so you can watch the entire arm move without the camera cutting or panning.';
      previewCameraModeToggle.textContent = fixed ? 'Fixed camera: On' : 'Fixed camera: Off';
      previewCameraModeToggle.classList.toggle('primary', fixed);
      previewCameraModeHint.textContent = fixed
        ? 'Fixed camera on: one unmoving wide angle keeps the whole arm in frame for every frame of the motion and every photo.'
        : 'Fixed camera off: the shot tracks whatever joints just moved. Turn on for one unmoving wide angle that keeps the whole arm in frame for every frame of the motion.';
    }
    cameraModeToggle.addEventListener('change', function(){
      applyCameraMode(cameraModeToggle.checked);
    });
    // Same toggle, surfaced inside the preview modal too, so you can turn
    // the fixed wide shot on/off right where you're checking the motion
    // loop, without having to close the preview and go back to the main
    // Camera panel.
    previewCameraModeToggle.addEventListener('click', function(){
      applyCameraMode(!cameraModeToggle.checked);
    });

    /* ---------------- Arm shot zoom slider ---------------- */
    var armZoomSlider = document.getElementById('arm-zoom-slider');
    var outArmZoom = document.getElementById('out-arm-zoom');
    armZoomSlider.addEventListener('input', function(){
      var pct = parseInt(armZoomSlider.value, 10) || 100;
      outArmZoom.textContent = pct + '%';
      Rig.setArmZoomPercent(pct);
    });

    /* ---------------- Upload a gesture from Gesture Library ----------------
       Loads a saved gesture back into the editor IN FULL: every step, with
       that step's complete joint pose, its delay, its name, its recorded
       group classification and its captured photo. The rig is driven to the
       gesture's final pose so every slider — fingers, wrist, elbow, both
       shoulder rotations and the extend joint — physically reflects where
       the gesture ends, which is the position you'd naturally keep building
       from. The loaded name is remembered so saving offers it back as the
       default rather than a fresh "Custom gesture 1234". */
    var libOverlay = document.getElementById('lib-overlay');
    var libList = document.getElementById('lib-list');
    var loadedGestureName = null;

    function readLibrary(){
      try{
        var hub = window.parent && window.parent.__zippyHub;
        if (hub && typeof hub.loadCustom === 'function'){
          var hostList = hub.loadCustom();
          if (Array.isArray(hostList)) return hostList;
        }
      }catch(e){}
      try{
        var raw = localStorage.getItem('zippyCustomGestures');
        var list = raw ? JSON.parse(raw) : [];
        return Array.isArray(list) ? list : [];
      }catch(e){ return []; }
    }

    function gestureRuntime(g){
      return (g.sequence || []).reduce(function(a, s){ return a + Math.max(0, s.delay || 0); }, 0);
    }

    // Which joint families a gesture actually touches, read from its poses
    // rather than from anything the author typed — so the row tells you
    // what you're about to load.
    function gestureParts(g){
      var base = Rig.defaultPose();
      var groups = { fingers:false, wrist:false, elbow:false, shoulder:false };
      (g.sequence || []).forEach(function(st){
        var p = st.pose || {};
        ['thumb','index','middle','ring','pinky'].forEach(function(id){
          if (p[id] != null && Math.round(p[id]) !== Math.round(base[id])) groups.fingers = true;
        });
