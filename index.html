        if (p['wrist-slider'] != null && Math.round(p['wrist-slider']) !== Math.round(base['wrist-slider'])) groups.wrist = true;
        if (p['arm-slider'] != null && Math.round(p['arm-slider']) !== Math.round(base['arm-slider'])) groups.elbow = true;
        ['shoulder-slider','abduction-slider','extend-slider'].forEach(function(id){
          if (p[id] != null && Math.round(p[id]) !== Math.round(base[id])) groups.shoulder = true;
        });
      });
      var names = Object.keys(groups).filter(function(k){ return groups[k]; });
      return names.length ? names.join(' + ') : 'static pose';
    }

    function openLibrary(){
      var list = readLibrary();
      if (!list.length){
        libList.innerHTML = '<div class="lib-empty">Nothing in your library yet.<br>Save a gesture first, then it will show up here to load and edit.</div>';
      } else {
        libList.innerHTML = list.map(function(g, i){
          var steps = (g.sequence || []).length;
          var secs = Math.round(gestureRuntime(g) / 100) / 10;
          var thumb = g.coverImage
            ? '<img class="lib-thumb" src="' + g.coverImage + '" alt="">'
            : '<div class="lib-thumb"></div>';
          return '<div class="lib-item" data-i="' + i + '">' + thumb +
            '<div class="lib-meta">' +
              '<div class="lib-name">' + (g.name || 'Untitled') + '</div>' +
              '<div class="lib-sub">' + steps + ' step' + (steps === 1 ? '' : 's') +
                ' \u00B7 ' + secs + 's \u00B7 ' + gestureParts(g) + '</div>' +
            '</div>' +
            '<button class="lib-load" type="button">Load</button></div>';
        }).join('');
        Array.prototype.forEach.call(libList.querySelectorAll('.lib-item'), function(row){
          row.addEventListener('click', function(){
            loadGestureIntoEditor(list[parseInt(row.dataset.i, 10)]);
          });
        });
      }
      libOverlay.classList.add('open');
    }
    function closeLibrary(){ libOverlay.classList.remove('open'); }

    function loadGestureIntoEditor(g){
      if (!g) return;
      var src = (g.sequence || []).filter(function(s){ return s && s.pose; });
      if (!src.length){ toast('That gesture has no recorded steps'); return; }

      stopPlayback(); // any running loop would fight the poses being loaded

      // Deep-copied so editing the loaded copy can never mutate the record
      // still sitting in localStorage.
      sequence = src.map(function(s, si){
        stepCounter++;
        return {
          id: 's' + Date.now() + '_' + stepCounter,
          name: s.name || ('Step ' + (si + 1)),
          pose: JSON.parse(JSON.stringify(s.pose)),
          groups: s.groups ? JSON.parse(JSON.stringify(s.groups)) : Rig.movedGroups(s.pose, Rig.defaultPose()),
          image: s.image || '',
          delay: Math.max(0, s.delay || 0),
          isGroup: !!s.isGroup
        };
      });

      var last = sequence[sequence.length - 1].pose;
      baselinePose = last;
      // Not silent: this drives every slider and every on-screen readout to
      // the loaded values, so the panel and the rig agree.
      Rig.applyPose(last);
      loadedGestureName = g.name || null;
      renderSequence();
      closeLibrary();
      toast('Loaded "' + (g.name || 'gesture') + '" \u2014 ' + sequence.length +
            ' steps. Edit and save as a new gesture.');
    }

    document.getElementById('upload-gesture-btn').addEventListener('click', openLibrary);
    document.getElementById('lib-close').addEventListener('click', closeLibrary);
    libOverlay.addEventListener('click', function(e){ if (e.target === libOverlay) closeLibrary(); });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && libOverlay.classList.contains('open')) closeLibrary();
    });

    /* ---------------- Preview modal ---------------- */
    var overlay = document.getElementById('preview-overlay');
    var previewImg = document.getElementById('preview-img');
    var previewVideoCanvas = document.getElementById('preview-video-canvas');
    var currentAngle = { image: 'auto', video: 'auto' };

    function angleGroupsOverride(angle, naturalGroups){
      // Manual angle chips override the auto-detected framing.
      if (angle === 'front') return { fingers: true, arm: false };
      if (angle === 'side') return { fingers: false, arm: true };
      if (angle === 'wide') return { fingers: true, arm: true };
      return naturalGroups; // 'auto'
    }

    function refreshImagePreview(){
      if (!sequence.length){
        previewImg.src = Rig.captureImage({ highQuality: true });
        return;
      }
      var last = sequence[sequence.length - 1];
      Rig.applyPose(last.pose, { silent: true });
      // Cover photo only: frame against everything that's non-default in
      // the FINAL pose (vs. Rig.defaultPose()), not just last.groups —
      // last.groups only records what changed in that one last recorded
      // step relative to the step before it. E.g. step1 moves the fingers,
      // step2 moves only the wrist from there: last.groups would say
      // "wrist only", so the cover photo would tightly crop to the wrist
      // and miss the fingers, even though the finished gesture has both
      // non-default. Using the cumulative diff from rest instead means a
      // single moved part still gets its single close-up, an adjacent
      // pair gets the tight two-part shot, and three-or-more (or a
      // non-adjacent pair) gets the full-coverage hero shot — the same
      // "cover everything, or just what's nearby" intelligence already in
      // Rig.frameForGroups, just fed the right (cumulative) groups here.
      var cumulativeGroups = Rig.movedGroups(last.pose, Rig.defaultPose());
      var groups = angleGroupsOverride(currentAngle.image, cumulativeGroups);
      Rig.frameForGroups(groups).then(function(){
        previewImg.src = Rig.captureImage({ highQuality: true });
      });
    }

    document.querySelectorAll('#image-angle-row .angle-chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        document.querySelectorAll('#image-angle-row .angle-chip').forEach(function(c){ c.classList.remove('active'); });
        chip.classList.add('active');
        currentAngle.image = chip.getAttribute('data-angle');
        refreshImagePreview();
      });
    });
    document.querySelectorAll('#video-angle-row .angle-chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        document.querySelectorAll('#video-angle-row .angle-chip').forEach(function(c){ c.classList.remove('active'); });
        chip.classList.add('active');
        currentAngle.video = chip.getAttribute('data-angle');
      });
    });

    document.getElementById('recapture-btn').addEventListener('click', function(){
      // Recapture always starts from a clean "Best angle" (auto) framing
      // instead of whatever angle chip was left active from before. Without
      // this, if the user had previously clicked Front/Side/Wide and then
      // hit Capture again, angleGroupsOverride() would keep forcing that
      // same hard-coded {fingers,arm} combo — which frequently does NOT
      // match this gesture's actual moved parts — instead of the correct
      // auto-detected framing. That mismatch is the "capture again jumps
      // to a bad position" bug: the shot would snap to a box sized for
      // the wrong set of joints.
      document.querySelectorAll('#image-angle-row .angle-chip').forEach(function(c){ c.classList.remove('active'); });
      var autoChip = document.querySelector('#image-angle-row .angle-chip[data-angle="auto"]');
      if (autoChip) autoChip.classList.add('active');
      currentAngle.image = 'auto';
      refreshImagePreview();
      toast('Recaptured cover image');
    });

    var previewVideoCtx = previewVideoCanvas.getContext('2d');

    // Draw a live frame from the 3D rig's canvas into the preview <canvas>
    // — this is what makes the "video" a genuine live replay of the actual
    // recorded joint values (the same pose data a real device would be
    // driven with), not a pre-baked video file.
    function drawFrameToPreviewCanvas(){
      var src = Rig.canvasEl;
      if (!previewVideoCanvas.width || previewVideoCanvas.width !== src.width || previewVideoCanvas.height !== src.height){
        previewVideoCanvas.width = src.width;
        previewVideoCanvas.height = src.height;
      }
      previewVideoCtx.drawImage(src, 0, 0, previewVideoCanvas.width, previewVideoCanvas.height);
    }

    var previewPlaying = false;
    var previewToken = 0;
    function runSmoothPreview(token){
      if (!sequence.length) return Promise.resolve();
      var current = Rig.currentPose();
      // openPreview() already applies sequence[0]'s pose before Play is
      // even clickable, so `current` here already equals sequence[0].pose.
      // Starting the loop at i=0 would tween from sequence[0] to
      // sequence[0] first — a zero-motion "step" that just sits still for
      // that whole step's delay before anything visibly moves, which reads
      // as "the video isn't playing". Skip straight to the next step so
      // motion starts immediately; the loop still wraps through every step
      // including 0, in order, once i%length comes back around.
      var i = sequence.length > 1 ? 1 : 0;
      function next(){
        if (token !== previewToken) return;
        var step = sequence[i % sequence.length];
        var groups = angleGroupsOverride(currentAngle.video, step.groups);
        var duration = Math.max(150, step.delay);
        return Rig.tweenTo(current, step.pose, duration, groups, function(){
          // Render the live rig frame into the preview canvas on every
          // tween tick, so the loop visibly eases through the actual
          // recorded values instead of jumping between static positions.
          drawFrameToPreviewCanvas();
        }).then(function(){
          current = step.pose;
          i++;
          if (token !== previewToken) return;
          return next();
        });
      }
      return next();
    }
    function previewPlay(){
      if (!sequence.length){ toast('No steps recorded yet'); return; }
      previewPlaying = true;
      previewToken++;
      var token = previewToken;
      document.getElementById('preview-play').disabled = true;
      document.getElementById('preview-pause').disabled = false;
      runSmoothPreview(token);
    }
    function previewStop(){
      previewPlaying = false;
      previewToken++;
      document.getElementById('preview-play').disabled = false;
      document.getElementById('preview-pause').disabled = true;
    }
    document.getElementById('preview-play').addEventListener('click', previewPlay);
    document.getElementById('preview-pause').addEventListener('click', previewStop);

    function openPreview(){
      if (!sequence.length){ toast('Save at least one position before previewing'); return; }
      // If the editor's own "Play" transport is still running from the
      // testing/editing view, its playback loop keeps calling Rig.tweenTo
      // in the background — and every tweenTo call cancels whatever tween
      // is currently in flight. That meant starting Play inside the
      // preview modal here got its tween cancelled almost immediately,
      // over and over, by the still-running editor loop, so it looked
      // like the preview simply wouldn't play. Stop that loop first.
      stopPlayback();
      gestureSaved = false;
      saveGestureBtn.disabled = false;
      savePublishBtn.disabled = false;
      overlay.classList.add('open');
      renderStepList(previewSeqListEl, null);
      refreshImagePreview();
      Rig.applyPose(sequence[0].pose, { silent: true });
      Rig.frameForGroups(sequence[0].groups).then(function(){
        drawFrameToPreviewCanvas();
      });
    }
    function closePreview(){
      previewStop();
      overlay.classList.remove('open');
    }
    document.getElementById('preview-cancel').addEventListener('click', closePreview);

    /* ---------------- Save / publish ---------------- */
    // "Video mode" here means: the saved gesture carries the full step-by-
    // step pose sequence (joint values + delays), and the library page
    // should replay those values live — driving its own copy of the rig
    // through the exact same motion, eased the same way — rather than
    // showing just a single static cover image. Nothing needs to be
    // "recorded" as a video file for this; the sequence array already IS
    // the motion data.
    function buildGestureRecord(published){
      var suggested = loadedGestureName
        ? loadedGestureName + ' (edited)'
        : 'Custom gesture ' + (Date.now() % 10000);
      var name = window.prompt('Name this gesture. This is what you will say to Zippy.\nSeparate several names with commas (e.g. spiderman, cool, yo):', suggested);
      if (!name) return null;
      return {
        id: 'g_' + Date.now(),
        name: name,
        videoMode: VIDEO_MODE,
        coverImage: previewImg.src || (sequence[0] && sequence[0].image),
        sequence: sequence.map(function(s){
          return { name: s.name, pose: s.pose, groups: s.groups, image: s.image, delay: s.delay, isGroup: !!s.isGroup };
        }),
        published: !!published,
        createdAt: Date.now()
      };
    }

    function persistGesture(record){
      try{
        // Handed to the host page rather than written here: the host owns
        // the grid, the Firebase publish path and the storage quota, so it
        // is the one place that decides what happens to a finished gesture.
        record.publisherEmail = (window.__zippyAccount && window.__zippyAccount.email) || null;
        record.publisherName  = (window.__zippyAccount && window.__zippyAccount.name) || 'You';
        window.parent.postMessage({ type: 'zippy:save', record: record }, '*');
        return true;
      }catch(e){
        console.error(e);
        return false;
      }
    }

    // Guards the two footer buttons against a double-click (or a slow
    // click landing twice) writing the same sequence into localStorage
    // twice — this was the other source of "repeated points". Once a
    // save is committed, both buttons stay disabled until the page
    // navigates away.
    var gestureSaved = false;
    var saveGestureBtn = document.getElementById('preview-save-gesture');
    var savePublishBtn = document.getElementById('preview-save-publish');
    function saveGesture(published){
      if (gestureSaved) return;
      var record = buildGestureRecord(published);
      if (!record) return;
      gestureSaved = true;
      saveGestureBtn.disabled = true;
      savePublishBtn.disabled = true;
      if (persistGesture(record)){
        toast(published ? 'Gesture saved and published to the library' : 'Gesture saved');
        setTimeout(function(){
          window.parent.postMessage({ type: 'zippy:done' }, '*');
        }, 900);
      } else {
        toast('Could not save gesture on this device');
        gestureSaved = false; // let them retry since nothing was actually persisted
        saveGestureBtn.disabled = false;
        savePublishBtn.disabled = false;
      }
    }

    document.getElementById('save-gesture-top').addEventListener('click', openPreview);
    saveGestureBtn.addEventListener('click', function(){ saveGesture(false); });
    savePublishBtn.addEventListener('click', function(){ saveGesture(true); });

  });
})();
<\/script>
<script>
/* Host bridge. The editor runs inside the library page's overlay iframe;
   these are the only two things it needs from the outside world. */
window.addEventListener('message', function(e){
  if (e.data && e.data.type === 'zippy:account') window.__zippyAccount = e.data.account;
});
document.getElementById('gesture-library-btn').addEventListener('click', function(){
  window.parent.postMessage({ type: 'zippy:close' }, '*');
});
<\/script>

</script>
<script>
(function(){
'use strict';
/* =====================================================================
   ZIPPY VOICE GESTURES
   - Motor mapping is copied 1:1 from the remote-control page
     (CAL / INVERT / FIELD / toMotor / write), so what is sent to the
     device is exactly what the remote sliders send.
   - Poses are written in slider (UI) values; fractions 0..1 are
     converted per joint range by F().
   ===================================================================== */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- joint table (from the remote-control page) ---------- */
const FIELD={thumb:'thumb',index:'index',middle:'middle',ring:'ring',pinky:'pinky',
  'wrist-slider':'wrist','arm-slider':'arm','shoulder-slider':'shoulder',
  'abduction-slider':'extend','extend-slider':'abduction'};
const INVERT={'arm-slider':true,'extend-slider':true,'abduction-slider':true};
const CAL={
  thumb:{ui:[0,90],servo:[0,180]},index:{ui:[0,100],servo:[0,180]},middle:{ui:[0,100],servo:[0,180]},
  ring:{ui:[0,100],servo:[0,180]},pinky:{ui:[0,100],servo:[0,180]},
  'wrist-slider':{ui:[0,180],servo:[0,130],neutral:{ui:90,servo:70}},
  'arm-slider':{ui:[68,110],servo:[0,360]},'shoulder-slider':{ui:[98,65],servo:[0,360]},
  'abduction-slider':{ui:[26,70],servo:[0,360]},'extend-slider':{ui:[0,14],servo:[0,360]}
};
function calMotor(id,x){
  const c=CAL[id],u0=c.ui[0],u1=c.ui[1],s0=c.servo[0],s1=c.servo[1];
  x=Math.max(Math.min(u0,u1),Math.min(Math.max(u0,u1),x));
  if(c.neutral){const nu=c.neutral.ui,ns=c.neutral.servo;
    return Math.round(x<=nu?(nu-u0?ns+(s0-ns)*((nu-x)/(nu-u0)):ns):(u1-nu?ns+(s1-ns)*((x-nu)/(u1-nu)):ns))}
  return Math.round(s0+(s1-s0)*((x-u0)/(u1-u0)));
}
const toMotor=(id,x)=>{const v=calMotor(id,x);return INVERT[id]?360-v:v};

/* rest position = where every slider starts (remote page defaultPose) */
const REST={thumb:0,index:0,middle:0,ring:0,pinky:0,'wrist-slider':90,'arm-slider':68,'shoulder-slider':98,'abduction-slider':26,'extend-slider':0};
const MAXF={thumb:90,index:100,middle:100,ring:100,pinky:100};
const KEYS={T:'thumb',I:'index',M:'middle',R:'ring',P:'pinky',W:'wrist-slider',E:'arm-slider',S:'shoulder-slider',L:'abduction-slider',X:'extend-slider'};
const c01=x=>Math.max(0,Math.min(1,x));
/* fraction 0..1 of a joint's slider range -> slider value
   fingers: 0 open .. 1 curled | W: 0..1 of 0-180 (.5 = flat) | E,S,L,X: rest -> far end */
function F(id,f){f=c01(f);if(MAXF[id])return Math.round(MAXF[id]*f);if(id==='wrist-slider')return Math.round(180*f);
  const u=CAL[id].ui;return Math.round(u[0]+(u[1]-u[0])*f)}
function part(spec){const o={};for(const k in spec)o[KEYS[k]]=F(KEYS[k],spec[k]);return o}     // only the joints named
const full=spec=>Object.assign({},REST,part(spec));                                           // rest + named joints
const H=(t,i,m,r,p,x)=>full(Object.assign({T:t,I:i,M:m,R:r,P:p},x||{}));                      // hand shape (all joints sent)
const J=spec=>part(spec);                                                                      // single joint(s) only
const st=(pose,d)=>({pose,d:d||0});
/* oscillate one joint between two values, n times, with fixed base */
function osc(base,key,a,b,n,d){const o=[];for(let k=0;k<n;k++){
  o.push(st(full(Object.assign({},base,{[key]:a})),d));o.push(st(full(Object.assign({},base,{[key]:b})),d))}return o}
const OPEN={T:0,I:0,M:0,R:0,P:0}, FISTS={T:1,I:1,M:1,R:1,P:1};

/* ---------- sending (identical to the remote page) ---------- */
let lastCode='',chain=Promise.resolve(),token=0,speedMul=1,lastRun=null;
function getCode(){
  let c='';try{if(typeof currentUserCode!=='undefined'&&currentUserCode)c=currentUserCode}catch(e){}
  c=c||lastCode||localStorage.getItem('zippyCurrentUserCode')||'';
  if(!c){try{const st=JSON.parse(localStorage.getItem('zippyCrossPageState_v1')||'null');if(st&&st.currentUserCode)c=String(st.currentUserCode)}catch(e){}}
  if(!c)c=(window.prompt('Enter your Zippy device code (the same one used on the remote page):')||'').trim();
  if(c){lastCode=c;try{localStorage.setItem('zippyCurrentUserCode',c)}catch(e){}}
  return c;
}
function send(pose){
  const run=chain.catch(()=>{}).then(async()=>{
    const code=getCode();if(!code)throw new Error('Device code needed');
    const fields={};Object.keys(pose).forEach(id=>{if(FIELD[id]&&pose[id]!=null&&isFinite(pose[id]))fields[FIELD[id]]=toMotor(id,pose[id])});
    const write=()=>db.ref('users/'+code+'/command').set(Object.assign({name:'finger_angles'},fields,{ts:firebase.database.ServerValue.TIMESTAMP}));
    try{if(auth.authStateReady)await auth.authStateReady()}catch(e){}
    if(!auth.currentUser)throw new Error('Not signed in on this site \u2013 sign in on the main page first');
    await write();
    return fields;
  });
  chain=run;return run;
}
/* plays steps in order; resolves as soon as the first command is accepted so the
   voice page is free for the next phrase while the motion keeps running */
function play(steps,label){
  const my=++token;
  return new Promise(res=>{(async()=>{
    let first=true;
    for(let i=0;i<steps.length;i++){
      if(my!==token)break;
      try{await send(steps[i].pose);if(first){first=false;res({ok:true,label})}}
      catch(e){const m='Not sent: '+((e&&e.message)||e);if(first){first=false;res({ok:false,label,reason:m})}else toast(m);return}
      const d=Math.round((steps[i].d||0)*speedMul);
      if(d&&i<steps.length-1)await sleep(d);
    }
    if(first)res({ok:true,label});
  })()});
}

/* ---------- understanding speech ---------- */
const norm=t=>String(t||'').toLowerCase().replace(/[\u2019']/g,'').replace(/&/g,' and ').replace(/[^a-z0-9% ]+/g,' ').replace(/\s+/g,' ').trim();
const WAKE=new Set(['zippy','zippi','zippie','zipi','zipy','zippey','sippy','zeppy','ziggy','zip']);
const LEAD=new Set('hey hi hello ok okay please kindly can could would will you just i want need to do does make show me perform give a an the lets let us go ahead now so my your for and also like'.split(' '));
const TRAIL=/\s(?:please|now|gesture|sign|pose|action|command|for me|right now|thanks)$/;
const NW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
const digits=s=>s.replace(/\b(?:(?:one|a) hundred|(?:twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)(?: (?:one|two|three|four|five|six|seven|eight|nine))?|zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen)\b/g,m=>/hundred/.test(m)?'100':String(m.split(' ').reduce((a,w)=>a+NW[w],0)));
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;const d=[];for(let j=0;j<=n;j++)d[j]=j;
  for(let i=1;i<=m;i++){let p=d[0];d[0]=i;for(let j=1;j<=n;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[n]}

let INDEX=new Map(),LIST=[];
function rebuild(){
  INDEX=new Map();LIST=[];
  customCmds().concat(CMDS).forEach(cmd=>cmd.names.forEach(n=>{
    const a=norm(n);if(!a)return;const sq=a.replace(/ /g,'');
    if(!INDEX.has(a))INDEX.set(a,cmd);if(!INDEX.has(sq))INDEX.set(sq,cmd);LIST.push({a,sq,cmd});
  }));
  LIST.sort((x,y)=>y.sq.length-x.sq.length);
}
const exact=x=>x?(INDEX.get(x)||INDEX.get(x.replace(/ /g,''))||null):null;

/* "elbow 50 percent", "wrist 120 degrees", "index to thirty" */
const JN={thumb:'thumb',index:'index','index finger':'index',pointer:'index',middle:'middle','middle finger':'middle',ring:'ring','ring finger':'ring',
  pinky:'pinky',pinkie:'pinky','little finger':'pinky',wrist:'wrist-slider',elbow:'arm-slider',forearm:'arm-slider',arm:'arm-slider',
  shoulder:'shoulder-slider','rotation one':'shoulder-slider','rotation 1':'shoulder-slider',lift:'abduction-slider','rotation two':'abduction-slider','rotation 2':'abduction-slider',
  extend:'extend-slider','extend joint':'extend-slider',fingers:'ALL','all fingers':'ALL'};
const JRE=new RegExp('^(?:(?:set|move|turn|bend|rotate|put|change) )*('+Object.keys(JN).sort((a,b)=>b.length-a.length).join('|')+')(?: finger| joint)?(?: to| at| by)? (\\d{1,3})(?: ?(percent|%|degrees?|deg))?$');
function param(t){
  const m=JRE.exec(digits(t));if(!m)return null;
  const id=JN[m[1]],v=Math.max(0,parseInt(m[2],10)),unit=m[3]||'',deg=/deg/.test(unit);
  const pose={};
  const pct=jid=>F(jid,v/100);
  if(id==='ALL')['thumb','index','middle','ring','pinky'].forEach(j=>pose[j]=deg?F(j,v/MAXF[j]):pct(j));
  else if(id==='wrist-slider')pose[id]=(deg||(!unit&&v>100))?Math.min(180,v):F(id,v/100);
  else if(MAXF[id]&&deg)pose[id]=F(id,v/MAXF[id]);
  else pose[id]=pct(id);
  const lab=m[1]+' '+v+(deg?'\u00b0':'%');
  return{cat:'Joint',names:[lab],label:lab,steps:[st(pose)]};
}

const TIMES={once:1,twice:2,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
function strip(A){
  const w=A.split(' '),cands=[];
  const trail=x=>{let C=x,k=0;while(k++<3&&TRAIL.test(C)&&C.replace(TRAIL,'').trim())C=C.replace(TRAIL,'').trim();return C};
  for(;;){const x=w.join(' ');cands.push(x);const t=trail(x);if(t!==x)cands.push(t);
    if(w.length>1&&LEAD.has(w[0]))w.shift();else break}
  return{cands,C:trail(w.join(' '))};
}
function single(A){
  const {cands,C}=strip(A);let c;
  for(const x of cands)if(c=exact(x))return{cmd:c,n:1,spd:1};
  /* repeat count / speed words */
  let n=1,spd=1,D=C;
  const tm=/\b(\d{1,2}|one|two|three|four|five|six|seven|eight|nine|ten) times?\b|\b(once|twice)\b/.exec(D);
  if(tm){n=Math.min(10,/^\d/.test(tm[1]||'')?parseInt(tm[1],10):TIMES[tm[1]||tm[2]]);D=D.replace(tm[0],' ')}
  if(/\b(slowly|slow)\b/.test(D)){spd=1.8;D=D.replace(/\b(slowly|slow)\b/g,' ')}
  if(/\b(quickly|fast|rapidly|quick)\b/.test(D)){spd=.55;D=D.replace(/\b(quickly|fast|rapidly|quick)\b/g,' ')}
  D=D.replace(/\s+/g,' ').trim();
  if(D&&D!==C){for(const x of strip(D).cands)if(c=exact(x))return{cmd:c,n,spd}}
  if(c=param(C))return{cmd:c,n:1,spd:1};
  const q=(D||C).replace(/ /g,'');
  if(q.length>=4){let best=null,bd=9,tie=false;
    LIST.forEach(e=>{if(e.sq.length<4)return;const lim=e.sq.length<=5?1:e.sq.length<=9?2:3;const d=lev(q,e.sq);
      if(d<=lim){if(d<bd){bd=d;best=e.cmd;tie=false}else if(d===bd&&e.cmd!==best)tie=true}});
    if(best&&!tie)return{cmd:best,n,spd}}
  return null;
}
function resolve(text){
  const A0=norm(text),A=A0.split(' ').filter(w=>!WAKE.has(w)).join(' ');
  if(!A)return{wakeOnly:!!A0,items:[]};
  const wakeHeard=A0!==A;
  const r=single(A);if(r)return{items:[r]};
  const parts=A.split(/\s+(?:and then|then|after that|afterwards|followed by|next|and)\s+/);
  if(parts.length>1){const items=parts.map(single);if(items.every(Boolean))return{items}}
  /* sentence containing a known name: "i think you should wave now" */
  const pad=' '+A+' ';
  for(const e of LIST){if(e.sq.length>=4&&pad.includes(' '+e.a+' ')){
    const tm=/\b(\d{1,2}|two|three|four|five) times\b|\b(twice)\b/.exec(A);
    return{items:[{cmd:e.cmd,n:tm?Math.min(10,/^\d/.test(tm[1]||'')?parseInt(tm[1],10):TIMES[tm[1]||tm[2]]):1,spd:/\bslow/.test(A)?1.8:/\b(fast|quick)/.test(A)?.55:1}]}}}
  return{items:[],wakeOnly:wakeHeard&&A.split(' ').every(w=>LEAD.has(w))};
}

async function handleSpeech(text){
  const r=resolve(text);
  if(!r.items.length)return r.wakeOnly?{ok:true,label:'Listening \u2013 say a gesture'}:{ok:false,reason:'Not recognized'};
  let steps=[],labels=[];
  for(const it of r.items){
    let s=it.cmd.steps,label=it.cmd.label||it.cmd.names[0];
    if(it.cmd.fn){const o=it.cmd.fn()||{};if(o.err){toast(o.err);return{ok:false,reason:o.err}}if(o.label)label=o.label;s=o.steps||[]}
    if(s.length>1&&it.n>1){const rep=[];for(let k=0;k<it.n;k++)s.forEach(x=>rep.push(x));s=rep;label+=' \u00d7'+it.n}
    s=s.map(x=>({pose:x.pose,d:x.d*it.spd}));
    if(steps.length&&s.length)steps[steps.length-1].d=Math.max(steps[steps.length-1].d||0,500);
    steps=steps.concat(s);labels.push(label);
  }
  const label=labels.join(' \u2192 ');
  toast(label);
  if(!steps.length)return{ok:true,label};
  lastRun={steps,label};
  return play(steps,label);
}
async function runName(name){const r=await handleSpeech(name);if(!r.ok)toast(r.reason||'Failed');return r}

const toastEl=document.createElement('div');toastEl.id='zvToast';document.body.appendChild(toastEl);

const cmdTab=document.createElement('button'),myTab=document.createElement('button');
[[cmdTab,'qtVoiceCmdTab','Commands'],[myTab,'qtVoiceMyTab','My gestures']].forEach(([b,id,l])=>{b.className='qt-voice-tab';b.id=id;b.type='button';b.setAttribute('role','tab');b.textContent=l;tabsEl.appendChild(b)});
const cmdPanel=document.createElement('section'),myPanel=document.createElement('section');
cmdPanel.className=myPanel.className='qt-voice-panel zv-panel';cmdPanel.id='qtVoiceCmdPanel';myPanel.id='qtVoiceMyPanel';
shell.appendChild(cmdPanel);shell.appendChild(myPanel);
function showTab(w){
  document.querySelectorAll('.qt-voice-tab').forEach(t=>t.classList.remove('active'));

  if(w==='commands')renderCmds();else renderMine();
}
cmdTab.addEventListener('click',()=>showTab('commands'));myTab.addEventListener('click',()=>showTab('mine'));
['qtVoiceSpeakTab','qtVoiceHistoryTab'].forEach(id=>document.getElementById(id).addEventListener('click',()=>{
  cmdTab.classList.remove('active');myTab.classList.remove('active');cmdPanel.classList.remove('active');myPanel.classList.remove('active')}));

let filter='';
function renderCmds(){
  const cats={};customCmds().concat(CMDS).forEach(c=>{if(filter&&!(c.names.join(' ')+' '+c.cat).toLowerCase().includes(filter))return;(cats[c.cat]=cats[c.cat]||[]).push(c)});
  const total=CMDS.length,phr=CMDS.reduce((a,c)=>a+c.names.length,0);
  let h='<div class="zv-wrap"><div class="zv-intro"><b>'+total+' built-in commands</b> \u00b7 '+phr+' phrases. Say <i>\u201cHey Zippy, wave\u201d</i> or just <i>\u201cwave\u201d</i>. '+
    'Add <i>\u201cthree times\u201d</i>, <i>\u201cslowly\u201d</i>, chain with <i>\u201cthen\u201d</i>, or set joints: <i>\u201celbow 50 percent\u201d</i>, <i>\u201cwrist 120 degrees\u201d</i>.</div>'+
    '<input class="zv-search" id="zvSearch" type="search" placeholder="Search commands\u2026" value="'+esc(filter)+'">';
  Object.keys(cats).forEach(k=>{h+='<div class="zv-cat">'+esc(k)+' <span>'+cats[k].length+'</span></div>';
    cats[k].forEach(c=>{h+='<div class="zv-row"><div class="zv-name"><b>'+esc(c.names[0])+'</b><small>'+esc(c.names.slice(1,7).join(' \u00b7 '))+'</small></div>'+
      '<button type="button" class="zv-run" data-n="'+esc(c.names[0])+'">Run</button></div>'})});
  cmdPanel.innerHTML=h+'</div>';
  const s=document.getElementById('zvSearch');
  s.addEventListener('input',()=>{filter=s.value.trim().toLowerCase();const p=s.selectionStart;renderCmds();const n=document.getElementById('zvSearch');n.focus();n.setSelectionRange(p,p)});
}
cmdPanel.addEventListener('click',e=>{const b=e.target.closest('.zv-run');if(b)runName(b.dataset.n)});

function renderMine(){
  const l=loadCustom();
  let h='<div class="zv-wrap"><div class="zv-intro">Build a motion with the sliders, press <b>Save</b>, and its name becomes a voice command. '+
    'Give it several names separated by commas (e.g. <i>spiderman, cool, yo</i>) and they all play the same gesture.</div>'+
    '<button type="button" class="zv-create" id="zvCreate">+ Create gesture</button>';
  if(!l.length)h+='<div class="zv-empty">No custom gestures yet.</div>';
  l.forEach(g=>{const secs=Math.round((g.sequence||[]).reduce((a,s)=>a+(s.delay||0),0)/100)/10;
    h+='<div class="zv-row">'+(g.cover?'<img class="zv-thumb" src="'+esc(g.cover)+'" alt="">':'<div class="zv-thumb"></div>')+
      '<div class="zv-name"><b>'+esc(g.name)+'</b><small>say: '+esc((g.names||[g.name]).join(' \u00b7 '))+' \u00b7 '+(g.sequence||[]).length+' steps \u00b7 '+secs+'s</small></div>'+
      '<span class="zv-btns"><button type="button" class="zv-run" data-g="'+esc(g.id)+'" data-a="run">Run</button>'+
      '<button type="button" class="zv-run alt" data-g="'+esc(g.id)+'" data-a="names">Names</button>'+
      '<button type="button" class="zv-run alt" data-g="'+esc(g.id)+'" data-a="del">Delete</button></span></div>'});
  myPanel.innerHTML=h+'</div>';
  document.getElementById('zvCreate').addEventListener('click',openCreator);
}
myPanel.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  let l=loadCustom();const g=l.find(x=>x.id===b.dataset.g);if(!g)return;
  if(b.dataset.a==='run')runName(g.names[0]);
  if(b.dataset.a==='names'){const v=window.prompt('Spoken names (separate with commas):',(g.names||[g.name]).join(', '));
    if(v){const n=v.split(/\s*[,;|\/]\s*/).map(s=>s.trim()).filter(Boolean);if(n.length){g.names=n;g.name=n[0];saveCustom(l);rebuild();renderMine();toast('Names updated')}}}
  if(b.dataset.a==='del'&&window.confirm('Delete "'+g.name+'"?')){saveCustom(l.filter(x=>x.id!==g.id));rebuild();renderMine();toast('Deleted')}
});

/* creator overlay (the creator page from the gesture hub, in an isolated iframe) */
const ov=document.createElement('div');ov.id='zvCreatorOverlay';
ov.innerHTML='<div class="zv-cbar"><b>Create gesture</b><span>Move the joints, save positions, then Save Gesture \u2013 its name is the phrase you say.</span><button type="button" id="zvCreatorClose" aria-label="Close">\u2715</button></div><iframe id="zvCreatorFrame" title="Gesture creator"></iframe>';
document.body.appendChild(ov);
const frame=document.getElementById('zvCreatorFrame');
function openCreator(){
  ov.classList.add('open');
  frame.srcdoc=document.getElementById('zvCreatorDoc').textContent.replace(/<\\\/script>/g,'<\/script>');
}
function closeCreator(){ov.classList.remove('open');try{frame.srcdoc='<!doctype html><html><body></body></html>'}catch(e){}}
document.getElementById('zvCreatorClose').addEventListener('click',closeCreator);
window.addEventListener('message',ev=>{
  const m=ev.data;if(!m||typeof m!=='object'||(ev.source&&ev.source!==frame.contentWindow))return;
  if(m.type==='zippy:save')onSaved(m.record);
  else if(m.type==='zippy:close'||m.type==='zippy:done'){closeCreator();showTab('mine')}
});
function onSaved(rec){
  if(!rec||!Array.isArray(rec.sequence))return;
  const names=String(rec.name||'').split(/\s*[,;|\/]\s*|\s+or\s+/i).map(s=>s.trim()).filter(Boolean);
  const seq=rec.sequence.filter(s=>s&&s.pose).map(s=>{const p={};Object.keys(FIELD).forEach(id=>{const v=+s.pose[id];if(s.pose[id]!=null&&isFinite(v))p[id]=v});return{name:s.name||'',pose:p,delay:Math.max(0,+s.delay||0)}});
  if(!seq.length){toast('That gesture has no steps');return}
  const g={id:rec.id||('g_'+Date.now()),name:names[0]||('gesture '+(Date.now()%1000)),names:names.length?names:['gesture '+(Date.now()%1000)],created:Date.now(),
    cover:(rec.coverImage&&String(rec.coverImage).length<120000)?rec.coverImage:'',sequence:seq};
  let l=loadCustom().filter(x=>norm(x.name)!==norm(g.name));l.push(g);
  if(!saveCustom(l)){g.cover='';if(!saveCustom(l)){toast('Could not save \u2013 device storage is full');return}}
  rebuild();renderMine();renderCmds();toast('Saved \u2013 say \u201c'+g.names[0]+'\u201d');
}

rebuild();
window.ZV={toast,handleSpeech,resolve,runName,commands:CMDS,toMotor,openCreator,_norm:norm,_play:play,get speed(){return speedMul}};
})();
